/* Number animation — count up on view enter */
const __aniRafs=new WeakMap(); // el → rafId so a re-render can cancel a stale frame
function animateNumberEl(el){
  if(el.dataset.animated==="1")return;
  if(isMobileLayout()){el.dataset.animated="1";return;}
  const raw=el.textContent.trim();
  const num=parseFloat(raw);
  if(isNaN(num))return;
  el.dataset.animated="1";
  const target=num;
  const isInt=Number.isInteger(target)&&!raw.includes(".");
  const duration=Math.min(900,400+Math.abs(target)*8);
  const start=performance.now();
  el.textContent="0";
  function frame(now){
    if(!el.isConnected){__aniRafs.delete(el);return;} // bail if DOM was replaced
    const t=Math.min(1,(now-start)/duration);
    const eased=1-Math.pow(1-t,3);
    const v=target*eased;
    el.textContent=isInt?Math.round(v):v.toFixed(1);
    if(t<1)__aniRafs.set(el,requestAnimationFrame(frame));
    else __aniRafs.delete(el);
  }
  __aniRafs.set(el,requestAnimationFrame(frame));
}
function animateAllNumbers(scope){
  (scope||document).querySelectorAll(".ani-num").forEach(el=>{
    const prev=__aniRafs.get(el);
    if(prev)cancelAnimationFrame(prev);
    el.dataset.animated="";
    animateNumberEl(el);
  });
}

/* Sparkline SVG generator */
function sparkline(values,opts={}){
  const o={color:"#FF6B00",fill:false,height:34,...opts};
  if(!values||values.length<2)return "";
  const w=100,h=o.height;
  const max=Math.max(...values,1),min=Math.min(...values,0);
  const range=Math.max(0.001,max-min);
  const stepX=w/(values.length-1);
  const pts=values.map((v,i)=>[i*stepX,h-((v-min)/range)*(h-6)-3]);
  const polyline=pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const last=pts[pts.length-1];
  const fill=o.fill?`<polygon points="${polyline} ${w},${h} 0,${h}" fill="${o.color}" opacity="0.12"/>`:"";
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${fill}
    <polyline points="${polyline}" fill="none" stroke="${o.color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.5" fill="${o.color}"/>
  </svg>`;
}

/* Aerobic decoupling (Friel framework · cardiac-drift mechanism Coyle 2005)
   Pa:Hr efficiency = (1/paceSec) / HR · drift% positive = inefficiency grew */
function calcDecoupling(hr1,pace1,hr2,pace2){
  const p1=paceToSec(pace1),p2=paceToSec(pace2);
  const h1=parseInt(hr1),h2=parseInt(hr2);
  if(!p1||!p2||!h1||!h2)return null;
  const e1=(1/p1)/h1,e2=(1/p2)/h2;
  return ((e1-e2)/e1)*100;
}
function decouplingZone(pct){
  if(pct===null)return {label:"—",color:"var(--text-3)"};
  if(pct<=5)return {label:"Aerobic ✓",color:"var(--green)"};
  if(pct<=10)return {label:"Moderate",color:"var(--orange)"};
  return {label:"Aerobic gap ⚠",color:"var(--red)"};
}

/* Pace helpers — auto-compute / format pace as M:SS/km */
function calcPace(distKm,durMin){
  const d=parseFloat(distKm),m=parseFloat(durMin);
  if(!d||!m||d<=0||m<=0)return null;
  const sec=(m*60)/d;
  const mm=Math.floor(sec/60),ss=Math.round(sec%60);
  return `${mm}:${String(ss).padStart(2,"0")}`;
}
function paceToSec(pace){
  if(!pace||typeof pace!=="string")return null;
  const m=pace.match(/^(\d+):(\d{1,2})$/);
  if(!m)return null;
  return parseInt(m[1])*60+parseInt(m[2]);
}
function fmtPaceFromSec(sec){
  if(!sec||sec<=0)return "—";
  const mm=Math.floor(sec/60),ss=Math.round(sec%60);
  return `${mm}:${String(ss).padStart(2,"0")}`;
}

function renderWeekly(){
  const w=State.currentWeek;
  const week=PLAN[w-1];
  const phase=week.phase;
  const startDate=dateForWeekDay(w,0);
  const endDate=dateForWeekDay(w,6);
  const todayStr=todayISO();
  const log=Store.get(STORAGE.sessions,{});

  // metrics
  let kmLogged=0,sessionsDone=0,sessionsModified=0,hrSum=0,hrCount=0;
  let z1Min=0,z2Min=0,z3Min=0;
  for(let d=0;d<7;d++){
    const date=fmtISO(dateForWeekDay(w,d));
    const lg=log[date];
    if(lg){
      if(lg.status==="done"||lg.status==="modified"){
        sessionsDone++;
        if(lg.actualDistance)kmLogged+=parseFloat(lg.actualDistance)||0;
        if(lg.avgHR){hrSum+=parseInt(lg.avgHR);hrCount++;}
        const dur=parseInt(lg.actualDuration)||week.days[d].duration||0;
        // Prefer the actually-performed zone (from logged type) over the planned zone.
        const z=zoneForLog(lg,week.days[d]);
        if(z==="z1")z1Min+=dur;
        else if(z==="z2")z2Min+=dur;
        else if(z==="z3")z3Min+=dur;
        else if(z==="mixed"){z1Min+=dur*0.5;z2Min+=dur*0.4;z3Min+=dur*0.1;}
      }
      if(lg.status==="modified")sessionsModified++;
    }
  }
  const totalMin=z1Min+z2Min+z3Min;
  const z1Pct=totalMin?Math.round(z1Min/totalMin*100):0;
  const z2Pct=totalMin?Math.round(z2Min/totalMin*100):0;
  const z3Pct=totalMin?Math.round(z3Min/totalMin*100):0;

  // Day rows
  const dayRows=week.days.map((s,d)=>{
    const date=fmtISO(dateForWeekDay(w,d));
    const dateObj=dateForWeekDay(w,d);
    const lg=log[date]||{};
    const isToday=date===todayStr;
    const isModified=lg.status==="modified";

    const isSkipped=lg.status==="skipped";
    return `
      <div class="day-row ${isToday?"today":""} ${isModified?"modified":""}" data-date="${date}" data-day="${d}">

            ${s.type==="tune_race"?'<span class="chip chip-red">Race day</span>':''}

            ${lg.actualDuration?`<span class="muted">Actual: ${lg.actualDuration}min${lg.actualDistance?` · ${lg.actualDistance}km`:""}${lg.pace?` · ${lg.pace}/km`:""}${lg.avgHR?` · HR ${lg.avgHR}`:""}${lg.rpe?` · RPE ${lg.rpe}`:""}</span>`:""}

          <button class="checkbox ${isDone?"done":""} ${isSkipped?"skipped":""}" title="Mark done">${iconCheck()}</button>
        </div>
      </div>`;
  }).join("");

  // Week rhythm strip — the 7 days as a tappable overview
  const rhythm=`<div class="week-rhythm" role="list">
    ${week.days.map((s,d)=>{
      const date=fmtISO(dateForWeekDay(w,d));

  document.getElementById("view-weekly").innerHTML=`
    ${masthead("weekly",{
      title:"Weekly Plan",

  // Wire up events
  document.getElementById("wk-prev").addEventListener("click",()=>{if(State.currentWeek>1){State.currentWeek--;renderWeekly();}});

  document.getElementById("btn-today-jump").addEventListener("click",()=>{

  document.getElementById("btn-log-session").addEventListener("click",()=>{
    const today=todayISO();
    const t=todayUTC();
    const wi=weekIndexForDate(t);

      const dow=(t.getUTCDay()+6)%7;
      openSessionModal(wi,dow,today);

      openSessionModal(State.currentWeek,0,fmtISO(dateForWeekDay(State.currentWeek,0)));

  document.querySelectorAll(".day-row .checkbox").forEach(cb=>{

  document.querySelectorAll(".day-row .edit-btn").forEach(b=>{

    });
  });
  document.querySelectorAll(".day-row .day-body").forEach(b=>{
    b.addEventListener("click",e=>{
      if(e.target.closest("button"))return;
      const row=e.target.closest(".day-row");

      openSessionModal(State.currentWeek,d,row.dataset.date);
    });
  });
  document.querySelectorAll(".wr-day").forEach(b=>{
    b.addEventListener("click",()=>openSessionModal(State.currentWeek,parseInt(b.dataset.wrDay),b.dataset.wrDate));
  });
  wireWeekSwipe();
}

/* Swipe left/right on the weekly plan to change week (touch only). */
function wireWeekSwipe(){
  const el=document.getElementById("view-weekly");
  if(!el||el.dataset.swipe)return;
  el.dataset.swipe="1";
  let x0=0,y0=0,t0=0;
  el.addEventListener("touchstart",e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();},{passive:true});
  el.addEventListener("touchend",e=>{
    const t=e.changedTouches[0];const dx=t.clientX-x0,dy=t.clientY-y0;
    if(Date.now()-t0>600||Math.abs(dx)<70||Math.abs(dy)>45)return;
    if(dx<0&&State.currentWeek<ATHLETE.totalWeeks){State.currentWeek++;renderWeekly();}
    else if(dx>0&&State.currentWeek>1){State.currentWeek--;renderWeekly();}
  },{passive:true});
}

function tidBar(label,actual,target,color){
  return `<div class="tid-row">
    <div class="tid-head"><span class="label">${label}</span><span class="pct">${actual}% <span style="color:var(--text-3)">/ ${target}%</span></span></div>
    <div class="tid-track">
      <div class="tid-fill" style="width:${actual}%;background:${color}"></div>
      <div class="tid-target" style="left:${target}%"></div>
    </div>
  </div>`;
}

function nextMilestone(w){
  const items=[];
  for(let i=w+1;i<=ATHLETE.totalWeeks;i++){if(isRecoveryWeek(i)){items.push({d:i-w,t:`Down week (W${i})`});break;}}
  const ph=phaseForWeek(w);
  const nextPh=PHASES[PHASES.indexOf(ph)+1];
  if(nextPh) items.push({d:ph.weeks[1]-w+1,t:`Next phase: ${nextPh.name} (W${nextPh.weeks[0]})`});
  const peak=PLAN.find(x=>x.capMin&&x.weekNum>w);
  if(peak) items.push({d:peak.weekNum-w,t:`Longest run ${peak.longRunKm} km (W${peak.weekNum})`});
  PLAN.forEach(x=>{if(x.race&&x.weekNum>=w){const r=PLAN_SPEC.races.find(rr=>rr.id===x.race);items.push({d:x.weekNum-w,t:`${r?r.short:x.race} (W${x.weekNum})`});}});
  items.sort((a,b)=>a.d-b.d);
  return items.slice(0,3).map(i=>`<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px"><b style="color:var(--orange)">${i.d}wk</b> · ${i.t}</div>`).join("");
}

function toggleDone(date,wIdx,dIdx){
  const lg=getSessionLog(date)||{};
  const session=PLAN[wIdx-1].days[dIdx];
  if(lg.status==="done"||lg.status==="modified"){
    deleteSessionLog(date);
  } else {
    saveSessionLog(date,{
      status:"done",
      source:"manual",
      type:session.type,
      title:session.title,
      actualDuration:session.duration,
      timestamp:Date.now()
    },{replace:true});
  }
  rerenderCurrent();
}

          <div class="field"><label>1st half pace</label><input id="f-pace1" value="${lg.pace1||""}" placeholder="M:SS/km"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>2nd half HR</label><input id="f-hr2" type="number" inputmode="numeric" value="${lg.hr2||""}" placeholder="bpm"></div>

  showModal(html);
  const segBtns=document.querySelectorAll("#seg-status button");

    const dec=calcDecoupling(h1,p1,h2,p2);
    if(dec===null){elD.style.display="none";return;}
    const z=decouplingZone(dec);
    elD.style.display="block";
    elD.innerHTML=`<div style="font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:0.14em;font-weight:800">DECOUPLING</div>

      <div style="font-size:11.5px;color:${z.color};font-weight:600;margin-top:2px">${z.label}</div>`;
  }
  ["f-hr1","f-pace1","f-hr2","f-pace2"].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener("input",updateDecoupling);});

  document.getElementById("btn-save").addEventListener("click",()=>{
    if(sourceMode==="strava"&&!selectedStravaActivity){

      return;
    }
    const dur=document.getElementById("f-dur").value||null;
    const elapsed=document.getElementById("f-elapsed").value||null;
    const dist=document.getElementById("f-dist").value||null;
    let pace=document.getElementById("f-pace").value||null;
    if(!pace&&dur&&dist)pace=calcPace(dist,dur);
    const hr1=document.getElementById("f-hr1")?.value||null;
    const pace1=document.getElementById("f-pace1")?.value||null;
    const hr2=document.getElementById("f-hr2")?.value||null;
    const pace2=document.getElementById("f-pace2")?.value||null;
    const decoupling=calcDecoupling(hr1,pace1,hr2,pace2);
    let entry={
      status:curStatus||"done",
      type:document.getElementById("f-type").value,
      actualDuration:dur,
      elapsedDuration:elapsed,
      actualDistance:dist,
      pace:pace,
      avgHR:document.getElementById("f-hr").value||null,
      rpe:document.getElementById("f-rpe").value||null,
      cadence:document.getElementById("f-cad").value||null,
      hrTarget:document.getElementById("f-hrt").value||null,
      hr1,pace1,hr2,pace2,
      decoupling:decoupling!==null?decoupling.toFixed(1):null,
      notes:document.getElementById("f-notes").value||"",
      reason:document.getElementById("f-reason").value||"",
      title:session.title,
      timestamp:Date.now()
    };
    if(sourceMode==="strava"&&selectedStravaActivity){
      const stravaPatch=sessionPatchFromStravaActivity(selectedStravaActivity,session,{});
      entry={
        ...stravaPatch,
        ...entry,
        source:"strava",
        stravaId:String(selectedStravaActivity.id),
        stravaName:selectedStravaActivity.name,
        stravaSport:selectedStravaActivity.sportType,
        stravaUrl:selectedStravaActivity.url,
        stravaStartDate:selectedStravaActivity.startDateLocal||selectedStravaActivity.startDate||""
      };
    }else{
      entry=clearStravaSessionFields({...entry,source:"manual"});
    }
    saveSessionLog(date,entry,{replace:true});
    closeModal();
    rerenderAfterSessionChange();
  });
  const del=document.getElementById("btn-delete");
  if(del)del.addEventListener("click",()=>{deleteSessionLog(date);closeModal();rerenderAfterSessionChange();});
}

/* ---------- Load & form guard: real weekly km (Strava runs + manual log), ACWR, long-run jump,
   latest long-run quality from streams, plan progression warnings, decision rules ---------- */
const RUN_SPORTS=["Run","TrailRun","VirtualRun"];
function runsByDate(){
  const st=Store.get(STORAGE.strava,{});
  const byDate={};
  (st.activities||[]).forEach(a=>{
    if(!RUN_SPORTS.includes(a.sportType)||!a.localDate)return;
    const cur=byDate[a.localDate]||{km:0,longest:0};
    cur.km+=a.distanceKm||0;cur.longest=Math.max(cur.longest,a.distanceKm||0);
    byDate[a.localDate]=cur;
  });
  const log=Store.get(STORAGE.sessions,{});
  Object.entries(log).forEach(([date,lg])=>{
    if(byDate[date]||!lg)return;
    if((lg.status==="done"||lg.status==="modified")&&lg.actualDistance){
      const km=parseFloat(lg.actualDistance)||0;
      byDate[date]={km,longest:km};
    }
  });
  return byDate;
}
function weeklyRunSeries(endWeekIdx,lookbackWeeks=8){
  const byDate=runsByDate();
  const first=addDays(parseISO(ATHLETE.planStart),-7*lookbackWeeks);
  const series=[];
  for(let i=0;i<lookbackWeeks+endWeekIdx;i++){
    const ws=addDays(first,i*7);
    let km=0,longest=0;
    for(let d=0;d<7;d++){const r=byDate[fmtISO(addDays(ws,d))];if(r){km+=r.km;longest=Math.max(longest,r.longest);}}
    series.push({start:fmtISO(ws),km:Math.round(km*10)/10,longest:Math.round(longest*10)/10,planWeek:i-lookbackWeeks+1});
  }
  return series;
}
function latestAnalyzedLongRun(){
  const st=Store.get(STORAGE.strava,{});
  const withIntel=(st.activities||[]).filter(a=>a.intel&&a.distanceKm>=15).sort((a,b)=>String(b.localDate).localeCompare(String(a.localDate)));
  if(withIntel.length)return withIntel[0];
  const log=Store.get(STORAGE.sessions,{});
  const fromLog=Object.entries(log).filter(([d,lg])=>lg&&lg.intel).sort((a,b)=>b[0].localeCompare(a[0]));
  return fromLog.length?{localDate:fromLog[0][0],name:fromLog[0][1].title,distanceKm:parseFloat(fromLog[0][1].actualDistance)||0,intel:fromLog[0][1].intel}:null;
}
function computeGuard(wIdx){
  const G=PLAN_SPEC.guards;
  const week=PLAN[wIdx-1];
  const series=weeklyRunSeries(wIdx);
  const idx=series.length-1;
  const kms=series.map(x=>x.km);
  const trailing=kms.slice(Math.max(0,idx-4),idx);
  const acwr=FujiIntel.acwrKm(kms,idx);
  const guard=FujiIntel.weeklyGuard(week.targetKm,trailing);
  const priorLongest=series.slice(Math.max(0,idx-2),idx).map(x=>x.longest);
  const jump=FujiIntel.longRunJump(week.longRunKm,priorLongest);
  const lr=latestAnalyzedLongRun();
  const flags=[];
  const violations=FujiPlanEngine.checkProgression(PLAN_OBJ,G);
  (PLAN_OBJ.warnings||[]).forEach(w=>flags.push({cls:"warn",text:w}));
  violations.forEach(v=>flags.push({cls:"bad",text:`Plan guard: ${v.rule} in W${v.week} — ratio ${v.ratio} (limit ${v.limit}). Edit js/plan-spec.js.`}));
  if(guard.capped)flags.push({cls:"bad",text:`Decision rule 2 — this week's ${week.targetKm} km is above 1.5× your trailing average (${guard.avg} km). Cap the week at ${guard.capKm} km.`});
  else if(guard.caution)flags.push({cls:"warn",text:`This week is ${guard.ratio}× your trailing 4-week average (${guard.avg} km) — above the 1.3× caution line. Keep every easy run easy.`});
  if(jump.flag)flags.push({cls:"bad",text:`Long-run jump: ${week.longRunKm} km is ${jump.ratio}× the longest run of the last two weeks (${jump.max} km). Repeat ${Math.round(jump.max*1.2)} km instead.`});
  if(lr&&lr.intel){
    const i=lr.intel;
    if(i.stopPct!==null&&i.stopPct>G.stopPctMax)flags.push({cls:"warn",text:`${fmtShort(parseISO(lr.localDate))} long run: ${i.stopPct}% stopped time (limit ${G.stopPctMax}%). Next long run repeats the distance.`});
    if(i.cadenceDecayPct!==null&&i.cadenceDecayPct< -G.cadenceDecayMax)flags.push({cls:"warn",text:`${fmtShort(parseISO(lr.localDate))} long run: cadence fell ${Math.abs(i.cadenceDecayPct)}% (${i.cadenceStartSpm}→${i.cadenceEndSpm} spm). Form broke down late — shorten stride, plan the walk breaks.`});
    if(i.hrDriftPct!==null&&i.hrDriftPct>G.hrDriftMax)flags.push({cls:"warn",text:`${fmtShort(parseISO(lr.localDate))} long run: HR drift ${i.hrDriftPct}% (limit ${G.hrDriftMax}%). Too fast for the day, heat, or fuel.`});
  }
  const today=todayISO();
  const rules=PLAN_SPEC.decisionRules.filter(r=>[1,4].includes(r.id)).map(r=>{
    const due=r.id===1?"2026-10-04":"2026-11-15";
    const past=today>due;
    return {cls:past?"warn":"ok",text:`Decision rule ${r.id} · ${r.when}: ${r.rule}${past?" — due, decide now.":""}`};
  });
  const level=flags.some(f=>f.cls==="bad")?"bad":flags.some(f=>f.cls==="warn")?"warn":"ok";
  const lrOk=!!(lr&&lr.intel&&lr.intel.stopPct<=G.stopPctMax&&(lr.intel.cadenceDecayPct??0)>=-G.cadenceDecayMax);
  const headline=level==="bad"?flags.find(f=>f.cls==="bad").text:level==="warn"?flags.find(f=>f.cls==="warn").text:"No guard tripped this week. Continuous long run, easy days easy, same shoe.";
  return {week,acwr,guard,jump,lr,lrOk,flags,rules,level,headline,G};
}
function renderGuardCard(wIdx){
  const g=computeGuard(wIdx);
  const {week,acwr,guard,jump,lr,lrOk}=g;

  const lrLine=lr&&lr.intel?`${lr.distanceKm} km · ${fmtShort(parseISO(lr.localDate))} · stops ${lr.intel.stopPct}% · cadence ${lr.intel.cadenceStartSpm}→${lr.intel.cadenceEndSpm} · drift ${lr.intel.hrDriftPct??"—"}%`:"Sync Strava, then Analyze long runs in Settings";

function computeACWR(log,wIdx){
  // Acute = total minutes last 7 days. Chronic = avg total min/wk over last 28d (4 wk).
  const today=todayUTC();
  let acute=0,chronic=0;
  for(let i=0;i<28;i++){
    const d=addDays(today,-i);
    const wi=weekIndexForDate(d);
    if(wi<1||wi>ATHLETE.totalWeeks) continue; // skip days before plan starts / after race
    const date=fmtISO(d);
    const lg=log[date];
    if(!lg)continue;
    if(lg.status!=="done"&&lg.status!=="modified")continue;
    const dow=(d.getUTCDay()+6)%7;
    const dur=parseInt(lg.actualDuration)||(PLAN[wi-1]?PLAN[wi-1].days[dow]?.duration:0)||0;
    if(i<7)acute+=dur;
    chronic+=dur;
  }
  chronic=chronic/4; // average per week
  const ratio=chronic>0?(acute/chronic):0;
  let zone="No data",color="var(--text-2)";
  if(chronic===0){zone="Building baseline";color="var(--text-2)";}
  else if(ratio<0.8){zone="Detraining risk";color="var(--blue)";}
  else if(ratio<=1.3){zone="Sweet spot ✓";color="var(--green)";}
  else if(ratio<=1.5){zone="Caution";color="var(--orange)";}
  else{zone="Injury risk ⚠";color="var(--red)";}
  return {ratio:ratio.toFixed(2),zone,color,acute:Math.round(acute),chronic:Math.round(chronic)};
}

function renderSpeed(){
  const log=Store.get(STORAGE.sessions,{});
  const filter=State.speedFilter||"all";
  const speeds=[];
  for(let w=1;w<=ATHLETE.totalWeeks;w++){
    for(let d=0;d<7;d++){
      const s=PLAN[w-1].days[d];
      if(s.type==="speed"||s.type==="hill"){
        const date=fmtISO(dateForWeekDay(w,d));
        const lg=log[date];
        speeds.push({w,d,date,session:s,phase:phaseForWeek(w),lg:lg||null});
      }
    }
  }
  const filtered=speeds.filter(s=>filter==="all"||s.phase.short===filter);
  // Use filtered set for both Planned and Completed so the filter chips stay coherent.
  const planned=filtered.length;
  const completed=filtered.filter(s=>s.lg&&(s.lg.status==="done"||s.lg.status==="modified")).length;
  const inZone=filtered.filter(s=>{
    if(!s.lg||!s.lg.avgHR)return false;
    const hr=parseInt(s.lg.avgHR);
    if(s.session.zone==="z2")return hr>=155&&hr<=171;
    if(s.session.zone==="z3")return hr>=172;
    return true;
  }).length;
  const zonePct=completed?Math.round(inZone/completed*100):0;
  const completedPct=planned?Math.round(completed/planned*100):0;

  document.getElementById("view-speed").innerHTML=`
    ${masthead("speed",{
      title:"Speed Sessions",
      dek:`Every Wednesday quality session across the ${ATHLETE.totalWeeks}-week plan — incline walks, cruise intervals, and the Bunkado hill rehearsal. Only one hard day mid-week; the long run is the other.`,
      right:mhStat(`${completedPct}<span style="font-size:18px;color:var(--text-2)">%</span>`,"completed")
    })}
    <div class="grid grid-3 mb-16">
      <div class="metric card"><div class="metric-label">Planned</div><div class="metric-value">${planned}</div></div>
      <div class="metric card"><div class="metric-label">Completed</div><div class="metric-value">${completed}</div><div class="metric-sub">${completedPct}%</div></div>
      <div class="metric card"><div class="metric-label">In correct HR zone</div><div class="metric-value">${zonePct}%</div><div class="metric-sub">of completed sessions</div></div>
    </div>
    <div class="row mb-16">
      <span class="card-h" style="margin:0">Filter:</span>
      <div class="seg" id="speed-filter" style="max-width:520px">
        <button data-v="all" class="${filter==="all"?"active":""}">All</button>

  document.querySelectorAll("#speed-filter button").forEach(b=>b.addEventListener("click",()=>{State.speedFilter=b.dataset.v;renderSpeed();}));

    const tr=e.target.closest("tr");
    openSessionModal(parseInt(tr.dataset.w),parseInt(tr.dataset.d),tr.dataset.date);
  }));
}

          <div class="field-row">

          </div>
          <div class="field-row">
            <div class="field"><label>Air temp (°C)</label><input id="sw-temp" type="number" inputmode="numeric" placeholder="optional"></div>
            <div class="field"><label>Notes</label><input id="sw-notes" placeholder="e.g. easy Z1, humid"></div>
          </div>
          <button class="btn btn-primary" id="sw-calc" style="width:100%;margin-top:6px">Calculate</button>
        </div>
        <div>
          <div id="sw-result" style="padding:18px;background:var(--bg);border-radius:14px;border:1px solid var(--hairline-soft);min-height:240px;display:flex;flex-direction:column;justify-content:center">

    <div class="grid grid-2 mb-16">
      <div class="card">
        <div class="card-h">Sleep duration — last 30 days</div>
        <div style="height:200px"><canvas id="ch-sleep"></canvas></div>
        <div class="small muted mt-8">7-day avg: <b style="color:var(--text)">${slpAvg} hrs</b> · target ≥7.5 hrs · &lt;7 hrs = blunted adaptation (Halson 2014)</div>
      </div>
      <div class="card">
        <div class="card-h">Pace Trend — Z1 easy runs</div>
        <div style="height:200px"><canvas id="ch-pace"></canvas></div>
        <div class="small muted mt-8">Pace ↓ at constant HR = aerobic fitness ↑ (efficiency gain)</div>
      </div>
    </div>
  `;

  // Wire up handlers
  let st={soreness:todayR.soreness||0,energy:todayR.energy||0};
  document.querySelectorAll("#b-sore .star").forEach(b=>b.addEventListener("click",()=>{st.soreness=parseInt(b.dataset.v);document.querySelectorAll("#b-sore .star").forEach(x=>x.classList.toggle("on",parseInt(x.dataset.v)<=st.soreness));}));
  document.querySelectorAll("#b-energy .star").forEach(b=>b.addEventListener("click",()=>{st.energy=parseInt(b.dataset.v);document.querySelectorAll("#b-energy .star").forEach(x=>x.classList.toggle("on",parseInt(x.dataset.v)<=st.energy));}));
  document.getElementById("btn-bio-save").addEventListener("click",()=>{
    const all=Store.get(STORAGE.readiness,{});
    all[today]={
      ...(all[today]||{}),
      weight:document.getElementById("b-weight").value||null,
      rhr:document.getElementById("b-rhr").value||null,
      hrv:document.getElementById("b-hrv").value||null,
      sleep:document.getElementById("b-sleep").value||null,
      soreness:st.soreness,
      energy:st.energy,
      notes:document.getElementById("b-notes").value||"",
      ts:Date.now()
    };
    Store.set(STORAGE.readiness,all);
    flash("Biometrics saved");
    renderBiometrics();
  });
  document.getElementById("btn-target-save").addEventListener("click",()=>{
    const s=Store.get(STORAGE.settings,{});
    s.raceWeightTarget=document.getElementById("b-target").value||null;
    Store.set(STORAGE.settings,s);
    flash("Target saved");
    renderBiometrics();
  });

  // Sweat rate calculator wiring
  const swCalc=document.getElementById("sw-calc");
  if(swCalc){
    swCalc.addEventListener("click",()=>{
      const pre=parseFloat(document.getElementById("sw-pre").value);
      const post=parseFloat(document.getElementById("sw-post").value);
      const fluid=parseFloat(document.getElementById("sw-fluid").value)||0;
      const dur=parseFloat(document.getElementById("sw-dur").value);
      const temp=document.getElementById("sw-temp").value;
      const result=document.getElementById("sw-result");
      if(!pre||!post||!dur||pre<=post){
        result.innerHTML=`<div class="warn-box small">Need: pre weight, post weight (less than pre), and duration.</div>`;
        return;
      }
      // sweat loss (L) = (pre - post) + fluid intake (L)
      const lossKg=pre-post;
      const sweatL=lossKg+(fluid/1000);
      const sweatPerHr=sweatL/(dur/60);
      const dehydPct=(lossKg/pre)*100;
      // recommended fluid replacement during exercise: 80% of sweat rate (don't fully match, allow some loss)
      // post-exercise replacement: 150% of net loss (Sawka 2007)
      const recDuringHr=sweatPerHr*0.8*1000; // ml/hr
      const recPostL=lossKg*1.5;
      // dehydration interpretation (Casa 2019 NATA position)
      let dColor=dehydPct<2?"var(--green)":dehydPct<3?"var(--orange)":"var(--red)";
      let dLabel=dehydPct<2?"Acceptable (<2%)":dehydPct<3?"Moderate (2–3%)":"Severe (>3%)";
      // save to history
      const settings=Store.get(STORAGE.settings,{});
      settings.sweatRateHistory=settings.sweatRateHistory||[];
      settings.sweatRateHistory.push({date:todayISO(),sweatPerHr:sweatPerHr.toFixed(2),dehydPct:dehydPct.toFixed(1),temp:temp||null,notes:document.getElementById("sw-notes").value||"",ts:Date.now()});
      Store.set(STORAGE.settings,settings);
      result.innerHTML=`
        <div class="metric-label">SWEAT RATE</div>
        <div class="metric-value" style="color:var(--blue)">${sweatPerHr.toFixed(2)}<span style="font-size:14px;color:var(--text-2)"> L/hr</span></div>
        <div class="small muted" style="margin-top:4px">${(sweatPerHr*1000).toFixed(0)} ml/hr</div>
        <div class="divider"></div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:8px">
          <div class="small muted">Body mass loss</div>
          <div style="color:${dColor};font-weight:700;font-variant-numeric:tabular-nums">${dehydPct.toFixed(1)}% · ${dLabel}</div>
        </div>
        <div class="warn-box mt-12" style="padding:12px 14px">
          <div class="small" style="line-height:1.6">
            <b style="color:var(--blue)">During exercise:</b> aim ~${recDuringHr.toFixed(0)} ml/hr (80% replacement)<br>
            <b style="color:var(--blue)">Post-exercise replace:</b> ${recPostL.toFixed(2)} L over 2–4h (150% of net loss)<br>
            <b style="color:var(--blue)">Sodium:</b> 500–700 mg/L if &gt;1h hot conditions
          </div>
        </div>
        <div class="small muted mt-8" style="font-style:italic;font-size:10.5px">Saved to history · ACSM 2007 Sawka MSSE · NATA Casa 2019</div>
      `;
      flash("Sweat rate calculated · saved");
    });
  }

  // Charts
  drawWeightChart(entries,targetW);
  drawRhrHrvChart(entries);
  drawSleepChart(entries.slice(-30));
  drawPaceChart();
}

function avg(arr){const a=arr.filter(x=>!isNaN(x));return a.length?a.reduce((s,x)=>s+x,0)/a.length:0;}

/* Chart.js availability guard — CDN may be unreachable on a cold offline start.
   Swaps the canvas for a friendly note instead of throwing. */
function chartGuard(canvas){
  if(typeof Chart!=="undefined")return true;
  if(canvas&&canvas.parentElement){
    canvas.parentElement.innerHTML='<div class="muted small" style="display:flex;align-items:center;justify-content:center;height:100%;text-align:center;padding:12px">Charts unavailable offline — reconnect once and reload to enable.</div>';
  }
  return false;
}

/* Shared chart options helper */
const CHART_BASE={
  legend:{labels:{color:"#9A9AA0",font:{size:10,weight:"600"},usePointStyle:true,pointStyle:"circle",padding:14}},
  tooltip:{backgroundColor:"#1E1E22",borderColor:"#26262B",borderWidth:1,padding:12,titleFont:{size:12,weight:"700"},bodyFont:{size:12}},
  gridX:{grid:{display:false},ticks:{color:"#9A9AA0",font:{size:10,weight:"600"},maxTicksLimit:8}},
  gridY:{grid:{color:"rgba(255,255,255,0.04)"},ticks:{color:"#5A5A60",font:{size:10}},border:{display:false}}
};

function drawWeightChart(entries,targetW){
  const ctx=document.getElementById("ch-weight");if(!ctx||!chartGuard(ctx))return;
  const data=entries.filter(e=>e.weight).slice(-90).map(e=>({x:e.date,y:parseFloat(e.weight)}));
  const rolling=data.map((p,i)=>{
    const window=data.slice(Math.max(0,i-6),i+1);
    return {x:p.x,y:avg(window.map(w=>w.y))};
  });
  // gradient under rolling avg
  const ctx2d=ctx.getContext("2d");
  const grad=ctx2d.createLinearGradient(0,0,0,240);
  grad.addColorStop(0,"rgba(255,107,0,0.18)");
  grad.addColorStop(1,"rgba(255,107,0,0)");
  if(biometricsCharts.weight)biometricsCharts.weight.destroy();
  biometricsCharts.weight=new Chart(ctx,{
    type:"line",
    data:{datasets:[
      {label:"Daily",data,borderColor:"rgba(154,154,160,0.4)",backgroundColor:"transparent",pointRadius:2.5,pointBackgroundColor:"#9A9AA0",borderWidth:1,tension:0},
      {label:"7-day avg",data:rolling,borderColor:"#FF6B00",backgroundColor:grad,fill:true,pointRadius:0,borderWidth:2.5,tension:0.35},
      ...(targetW?[{label:"Race target",data:data.map(p=>({x:p.x,y:parseFloat(targetW)})),borderColor:"#34D399",borderDash:[6,6],pointRadius:0,borderWidth:1.5}]:[])
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:CHART_BASE.legend,tooltip:CHART_BASE.tooltip},scales:{x:{type:"category",...CHART_BASE.gridX},y:{...CHART_BASE.gridY,ticks:{...CHART_BASE.gridY.ticks,callback:v=>v+" kg"}}}}
  });
}
function drawRhrHrvChart(entries){
  const ctx=document.getElementById("ch-rhrhrv");if(!ctx||!chartGuard(ctx))return;
  const slice=entries.slice(-90);
  const rhr=slice.filter(e=>e.rhr).map(e=>({x:e.date,y:parseInt(e.rhr)}));
  const hrv=slice.filter(e=>e.hrv).map(e=>({x:e.date,y:parseInt(e.hrv)}));
  if(biometricsCharts.rhrhrv)biometricsCharts.rhrhrv.destroy();
  biometricsCharts.rhrhrv=new Chart(ctx,{
    type:"line",
    data:{datasets:[
      {label:"RHR (bpm)",data:rhr,borderColor:"#F43F5E",backgroundColor:"transparent",pointRadius:2.5,pointBackgroundColor:"#F43F5E",borderWidth:2,yAxisID:"y",tension:0.3},
      {label:"HRV (ms)",data:hrv,borderColor:"#60A5FA",backgroundColor:"transparent",pointRadius:2.5,pointBackgroundColor:"#60A5FA",borderWidth:2,yAxisID:"y1",tension:0.3}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:CHART_BASE.legend,tooltip:CHART_BASE.tooltip},scales:{
      x:{type:"category",...CHART_BASE.gridX},
      y:{position:"left",grid:{color:"rgba(255,255,255,0.04)"},ticks:{color:"#F43F5E",font:{size:10,weight:"600"}},border:{display:false}},
      y1:{position:"right",grid:{drawOnChartArea:false},ticks:{color:"#60A5FA",font:{size:10,weight:"600"}},border:{display:false}}
    }}
  });
}
function drawSleepChart(entries){
  const ctx=document.getElementById("ch-sleep");if(!ctx||!chartGuard(ctx))return;
  const data=entries.filter(e=>e.sleep).map(e=>({x:e.date,y:parseFloat(e.sleep)}));
  if(biometricsCharts.sleep)biometricsCharts.sleep.destroy();
  biometricsCharts.sleep=new Chart(ctx,{
    type:"bar",
    data:{datasets:[{label:"Sleep (hrs)",data,backgroundColor:data.map(d=>d.y>=7.5?"#34D399":d.y>=7?"#FF6B00":"#F43F5E"),borderRadius:4,borderSkipped:false}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:CHART_BASE.tooltip},scales:{
      x:{type:"category",...CHART_BASE.gridX,ticks:{...CHART_BASE.gridX.ticks,maxTicksLimit:7}},
      y:{...CHART_BASE.gridY,ticks:{...CHART_BASE.gridY.ticks,callback:v=>v+"h"},suggestedMin:5,suggestedMax:10}
    }}
  });
}
function drawPaceChart(){
  const ctx=document.getElementById("ch-pace");if(!ctx||!chartGuard(ctx))return;
  const log=Store.get(STORAGE.sessions,{});
  const z1=[],mp=[];
  for(const date in log){
    const lg=log[date];if(!lg.pace||(lg.status!=="done"&&lg.status!=="modified"))continue;
    const sec=paceToSec(lg.pace);if(!sec)continue;
    const t=lg.type;
    if(t==="easy_z1"||t==="recovery") z1.push({x:date,y:sec});
    else if(t==="mp_long"||t==="speed") mp.push({x:date,y:sec});
  }
  z1.sort((a,b)=>a.x.localeCompare(b.x));mp.sort((a,b)=>a.x.localeCompare(b.x));
  if(biometricsCharts.pace)biometricsCharts.pace.destroy();
  biometricsCharts.pace=new Chart(ctx,{
    type:"line",
    data:{datasets:[
      {label:"Z1 easy pace",data:z1,borderColor:"#34D399",backgroundColor:"transparent",pointRadius:3,pointBackgroundColor:"#34D399",borderWidth:2,tension:0.3},
      {label:"Quality pace",data:mp,borderColor:"#FF6B00",backgroundColor:"transparent",pointRadius:3,pointBackgroundColor:"#FF6B00",borderWidth:2,tension:0.3}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:CHART_BASE.legend,tooltip:{...CHART_BASE.tooltip,callbacks:{label:c=>c.dataset.label+": "+fmtPaceFromSec(c.parsed.y)+"/km"}}},scales:{
      x:{type:"category",...CHART_BASE.gridX,ticks:{...CHART_BASE.gridX.ticks,maxTicksLimit:6}},
      y:{reverse:true,...CHART_BASE.gridY,ticks:{...CHART_BASE.gridY.ticks,callback:v=>fmtPaceFromSec(v)}}
    }}
  });
}

          <div class="small muted mt-12">${p.focus}</div>
        </div>`).join("")}
    </div>

    <div class="card mb-16">
      <div class="card-h">Microcycle — weekly rhythm (Mon → Sun)</div>
      <div class="tbl-wrap mt-12">
        <table class="tbl tbl-cards" style="font-size:12.5px">
          <thead><tr><th>Day</th><th>Session</th><th>Zone</th><th>Rationale</th></tr></thead>
          <tbody>
            <tr><td><b>Mon</b></td><td>Strength A</td><td>Strength</td><td>Fresh after Sunday's spin · ≥6 h from any run (Fyfe 2018)</td></tr>
            <tr><td><b>Tue</b></td><td>Easy run (longest easy day)</td><td>Z1</td><td>Aerobic volume at HR &lt;150 · cadence ≥170</td></tr>
            <tr><td><b>Wed</b></td><td>Quality: strides / incline / cruise intervals / hills</td><td>Z1–Z2</td><td>The one hard mid-week day · Bunkado rehearsal lives here</td></tr>

        <b style="color:#60A5FA">Base (W4–6):</b> back to 100% of base, then a plateau week and a down week. Daniels prefers 3–4 week plateaus before bumping volume; the two injuries this year both followed weeks that skipped this.<br><br>

          ctx.fillText(r.label,xPos,chartArea.top+10);
          ctx.restore();
        });
      }
    }]
  });
}

        <div class="small muted mt-12">Why 7:45 and not 7:30: Bangkok at 02:00 is 24–28 °C; the same effort at Fuji's 2–8 °C is worth 6–10% (Ely 2007). 7:45 here at HR ≤160 is the evidence that 7:30 in the cold is a marathon pace, not a 10 km pace.</div>

      <details class="mt-12">

/* =========================================================================
   17d. KNOWLEDGE VIEW — K7, K8, K10, K12, K13, K14
   All citations verifiable to peer-reviewed sources.

function renderKnowledge(){
  document.getElementById("view-knowledge").innerHTML=`
    ${masthead("knowledge",{
      title:"Knowledge",
      dek:"The field manual — warmup, mobility, emergencies, pacing, failure modes, and a glossary with receipts. Every claim cited.",
      right:mhStat("K7–K14","chapters")
    })}

    <!-- ============ K7 · DYNAMIC WARMUP ============ -->
    <div class="card mb-16">
      <div class="k-head"><span class="k-index">K7</span><div class="k-titles"><div class="k-title">Pre-run dynamic warmup</div><div class="k-meta">5–8 min · before every quality session</div></div></div>
      <div class="small muted mt-8" style="line-height:1.6">Dynamic warmup acutely improves running performance and may reduce injury vs static stretching. Routine raises core temp and primes neuromuscular activation. <i>McGowan 2015 Sports Med · Behm & Chaouachi 2011 Eur J Appl Physiol · Fradkin 2010 J Strength Cond Res</i></div>
      <div class="grid grid-2 mt-16">
        <div class="ex-card">
          <div class="ex-name">1 · Easy jog</div>
          <div class="ex-prescription">3–5 min · build to 60% effort</div>
          <span class="ex-tag">Raise core temperature</span>
        </div>
        <div class="ex-card">
          <div class="ex-name">2 · Leg swings (front–back)</div>
          <div class="ex-prescription">10/leg · hold support</div>
          <span class="ex-tag">Hip flexors / hamstrings</span>
        </div>
        <div class="ex-card">
          <div class="ex-name">3 · Leg swings (side–side)</div>
          <div class="ex-prescription">10/leg</div>
          <span class="ex-tag">Adductors / abductors</span>
        </div>
        <div class="ex-card">
          <div class="ex-name">4 · Walking lunges (with rotation)</div>
          <div class="ex-prescription">10/leg · twist toward front leg</div>
          <span class="ex-tag">Glutes + thoracic mobility</span>
        </div>
        <div class="ex-card">
          <div class="ex-name">5 · A-skips</div>
          <div class="ex-prescription">2 × 20 m</div>
          <span class="ex-tag">Knee drive · neural activation</span>
        </div>
        <div class="ex-card">
          <div class="ex-name">6 · High knees + Butt kicks</div>
          <div class="ex-prescription">2 × 20 m each</div>
          <span class="ex-tag">Cadence + hamstring activation</span>
        </div>
        <div class="ex-card" style="grid-column:span 2;border:1px solid rgba(255,107,0,0.3)">
          <div class="ex-name" style="color:var(--orange)">7 · Strides (race-day specifically)</div>
          <div class="ex-prescription">4 × 80–100 m progressing 70% → 80% → 90% → 95% effort · 90 s walk-recovery</div>
          <span class="ex-tag">Race priming · neuromuscular potentiation</span>
        </div>
      </div>
      <div class="warn-box mt-16">
        <b>When to use:</b> Before EVERY quality session (Wed speed, Sat long, race day). Skip warmup #7 strides for easy Z1 days — replace with extra 3 min jog instead.
      </div>
    </div>

    <!-- ============ K8 · POST-RUN MOBILITY ============ -->
    <div class="card mb-16">
      <div class="k-head"><span class="k-index">K8</span><div class="k-titles"><div class="k-title">Post-run mobility</div><div class="k-meta">5 min · maintenance, honestly framed</div></div></div>
      <div class="small muted mt-8" style="line-height:1.6">
        <b style="color:var(--text)">Honest framing:</b> Post-run static stretching has SMALL effects on flexibility and MINIMAL effect on injury prevention or DOMS recovery (Behm 2016 <i>Appl Physiol Nutr Metab</i> systematic review). Foam rolling has small recovery benefit (Wiewelhove 2019 <i>Front Physiol</i> meta-analysis). Primary value here = <b style="color:var(--text)">mobility maintenance + nervous-system down-regulation</b>, not magic recovery.
      </div>
      <div class="grid grid-2 mt-16">
        <div class="ex-card">
          <div class="ex-name">1 · Calf wall stretch</div>
          <div class="ex-prescription">30s × 2/leg · straight knee + bent knee variations</div>
          <span class="ex-tag">Gastroc / soleus</span>
        </div>
        <div class="ex-card">
          <div class="ex-name">2 · Couch stretch (hip flexor)</div>
          <div class="ex-prescription">30s × 2/leg · rear foot on couch · vertical torso</div>
          <span class="ex-tag">Hip flexors (most-tight in runners)</span>
        </div>
        <div class="ex-card">
          <div class="ex-name">3 · Pigeon stretch</div>
          <div class="ex-prescription">60s × 2/side · breathe, don't push</div>
          <span class="ex-tag">Glute medius / piriformis</span>
        </div>
        <div class="ex-card">
          <div class="ex-name">4 · 90/90 hip rotation</div>
          <div class="ex-prescription">8 reps/side · sit, switch legs side-to-side</div>
          <span class="ex-tag">Internal/external hip rotation</span>
        </div>
        <div class="ex-card">
          <div class="ex-name">5 · Standing hamstring</div>
          <div class="ex-prescription">30s × 2/leg · foot on bench, hinge from hip</div>
          <span class="ex-tag">Hamstring lengthening</span>
        </div>
        <div class="ex-card">
          <div class="ex-name">6 · (Optional) Foam roll</div>
          <div class="ex-prescription">2 min total · quads, ITB, calves · slow passes</div>
          <span class="ex-tag">Optional · small recovery effect</span>
        </div>
      </div>
    </div>

    <!-- ============ K10 · CRAMP / BONK EMERGENCY ============ -->
    <div class="card mb-16">
      <div class="k-head"><span class="k-index">K10</span><div class="k-titles"><div class="k-title">On-race emergency protocols</div><div class="k-meta">Cramp · bonk · hyponatremia</div></div></div>

      <div class="grid grid-2 mt-12">
        <div class="ex-card" style="border:1px solid rgba(244,63,94,0.3);background:linear-gradient(135deg,rgba(244,63,94,0.04),var(--card-elev))">
          <div class="ex-name" style="color:var(--red)">CRAMP (EAMC)</div>
          <div class="small mt-12" style="line-height:1.7">
            <b>Mechanism:</b> Strongest evidence supports altered neuromuscular control / fatigue theory — NOT primarily electrolyte depletion (Schwellnus 2009 <i>BJSM</i> review).<br><br>
            <b>Treatment (in order):</b>
            <ol style="padding-left:18px;margin-top:6px">
              <li>STOP. Slow / stop running.</li>
              <li>Gentle static stretch of cramping muscle (30–60s)</li>
              <li>Sip pickle juice / mustard / vinegar 30–60 ml — relief in ~85 s via TRPV1 oropharyngeal reflex (Miller 2010 <i>MSSE</i>) — this is NOT an electrolyte effect</li>
              <li>Sip electrolyte drink (preventive · adequacy)</li>
              <li>Resume at 30–60 sec/km slower for 5 min before re-evaluating</li>
            </ol>
            <b>Prevention:</b> Train at race intensity (specificity); maintain hydration; avoid going out hard.
          </div>
        </div>

        <div class="ex-card" style="border:1px solid rgba(255,107,0,0.3);background:linear-gradient(135deg,rgba(255,107,0,0.04),var(--card-elev))">
          <div class="ex-name" style="color:var(--orange)">BONK (Glycogen depletion / hypoglycemia)</div>
          <div class="small mt-12" style="line-height:1.7">
            <b>Mechanism:</b> Muscle/liver glycogen depletion at sustained submaximal work limits performance; blood glucose drop affects CNS (Coyle 1986 <i>J Appl Physiol</i>; Burke 2017 <i>Sports Med</i> review).<br><br>
            <b>Treatment:</b>
            <ol style="padding-left:18px;margin-top:6px">
              <li>Reduce pace immediately by 30–60 sec/km</li>
              <li>Ingest 60 g rapid CHO: 1 gel + 200 ml sports drink + handful gummies if available</li>
              <li>Allow 15–20 min for absorption — DO NOT push through</li>
              <li>If recovered → resume at slightly slower goal pace</li>
              <li>If not recovered in 20 min → walk to finish; race is salvage mode</li>
            </ol>
            <b>Prevention:</b> 60–90 g CHO/hr from km 5 onwards (Jeukendrup 2014 <i>Sports Med</i>) · multi-transportable carbs (glucose+fructose 2:1) · D-1 carb load 6–10 g/kg
          </div>
        </div>

        <div class="ex-card" style="border:1px solid rgba(96,165,250,0.3);background:linear-gradient(135deg,rgba(96,165,250,0.04),var(--card-elev));grid-column:span 2">
          <div class="ex-name" style="color:var(--blue)">⚠ HYPONATREMIA — DANGER (Exercise-Associated Hyponatremia · EAH)</div>
          <div class="small mt-12" style="line-height:1.7">
            Drinking water in EXCESS of fluid losses dilutes blood sodium and can cause cerebral edema and death. Risk factors: slow runner pace (>4h finish), aggressive water-only intake at every aid, female sex, NSAID use. (Hew-Butler 2015 <i>Clin J Sport Med</i> consensus statement)<br><br>
            <b>Rules:</b>
            <ul style="padding-left:18px;margin-top:6px">
              <li>Drink to PLAN (sweat-rate based · K2 calculator), not to thirst-only AND not to "stay ahead"</li>
              <li>Use electrolyte drink (not plain water) when fluid intake &gt;500 ml/hr</li>
              <li>Symptoms: nausea, headache, confusion, swelling fingers/face, cramping (post-race) → STOP fluid + seek medical</li>
              <li><b>At a ~5:00 finish the risk is REAL</b> (&gt;4 h on course is the #1 risk factor) — drink to plan, use electrolyte drink, never "stay ahead" with plain water</li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ K14 · PACING STRATEGY ============ -->
    <div class="card mb-16">
      <div class="k-head"><span class="k-index">K14</span><div class="k-titles"><div class="k-title">Marathon pacing strategies</div><div class="k-meta">Even · negative · positive — pick before the gun</div></div></div>
      <div class="small muted mt-12" style="line-height:1.6">Three pacing patterns dominate marathon racing. Choice has measurable effect on outcome.</div>

      <div class="grid grid-3 mt-16">
        <div class="ex-card" style="border-color:rgba(52,211,153,0.35)">
          <div class="ex-name" style="color:var(--green)">EVEN SPLIT</div>
          <div class="small mt-8" style="line-height:1.6">Same pace from km 1 to finish. Most world-record marathons are run very close to even (within 1–2%). (Hanley 2014 <i>Front Physiol</i>)</div>
          <div class="small mt-8" style="color:var(--text-2)"><b>For James:</b> 7:06/km × 42.2 = <b style="color:var(--text)">4:59:45</b></div>
          <span class="ex-tag" style="background:rgba(52,211,153,0.15);color:var(--green)">Default · simplest mentally</span>
        </div>
        <div class="ex-card" style="border-color:rgba(255,107,0,0.35)">
          <div class="ex-name" style="color:var(--orange)">NEGATIVE SPLIT (recommended)</div>
          <div class="small mt-8" style="line-height:1.6">Slightly faster 2nd half. Preserves glycogen + form; lower bonk risk for amateurs. Associated with better outcomes in non-elite (Diaz et al. 2018 <i>Eur J Sport Sci</i>).</div>
          <div class="small mt-8" style="color:var(--text-2)"><b>For James:</b> 1st half 7:09 · 2nd half 7:03 = <b style="color:var(--text)">~4:59:30</b></div>
          <span class="ex-tag" style="background:rgba(255,107,0,0.15);color:var(--orange)">Recommended · safer execution</span>
        </div>
        <div class="ex-card" style="border-color:rgba(244,63,94,0.35)">
          <div class="ex-name" style="color:var(--red)">POSITIVE SPLIT (avoid)</div>
          <div class="small mt-8" style="line-height:1.6">Went out too fast → 2nd half slower. Common amateur error. Slowdown &gt;2% (≈9 sec/km) signals significant glycogen / form failure (Hanley 2014).</div>
          <div class="small mt-8" style="color:var(--text-2)"><b>Avoid by:</b> first 5 km HR &lt;155 disciplined; check pace at 5K split</div>
          <span class="ex-tag" style="background:rgba(244,63,94,0.15);color:var(--red)">Most common failure mode</span>
        </div>
      </div>

      <div class="card mt-16" style="background:var(--card-elev)">
        <div class="card-h">FUJI RACE PLAN — NEGATIVE SPLIT EXECUTION</div>
        <div class="tbl-wrap mt-12" style="background:transparent;border:none">
          <table class="tbl" style="font-size:13px">
            <thead><tr><th>Segment</th><th>Target Pace</th><th>HR</th><th>Mental Cue</th></tr></thead>
            <tbody>
              <tr><td><b>km 0–5</b></td><td>7:09–7:12</td><td>&lt;155</td><td>"Hold back. This should feel TOO easy."</td></tr>
              <tr><td><b>km 5–21</b></td><td>7:06</td><td>150–158</td><td>"Settle in. Fuel on schedule."</td></tr>
              <tr><td><b>km 21–30</b></td><td>7:06</td><td>152–160</td><td>"The race starts at 30."</td></tr>
              <tr><td><b>km 30–38</b></td><td>7:03–7:06</td><td>155–164</td><td>"This is the work. You trained for this hurt."</td></tr>
              <tr><td><b>km 38–42</b></td><td>6:58–7:06</td><td>up to 170</td><td>"Empty the tank."</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ============ K13 · FAILURE MODES ============ -->
    <div class="card mb-16">
      <div class="k-head"><span class="k-index">K13</span><div class="k-titles"><div class="k-title">Failure mode recovery</div><div class="k-meta">When things go wrong — protocol, not improvisation</div></div></div>
      <div class="small muted mt-12">When things go wrong — don't improvise. Below are evidence-anchored protocols.</div>
      <div class="tbl-wrap mt-16">
        <table class="tbl">
          <thead><tr><th style="min-width:180px">Situation</th><th>Action</th><th>Source</th></tr></thead>
          <tbody>
            <tr><td><b>Behind plan 1–3 days</b></td><td>Resume current. <b>Don't double up sessions.</b> The plan absorbs minor disruption.</td><td><i>Coaching practice</i></td></tr>
            <tr><td><b>Behind 1 week</b></td><td>Skip what was missed. Resume current week. If at phase transition, hold an extra week in current phase.</td><td><i>Coaching practice</i></td></tr>
            <tr><td><b>Sick — fever / body aches / chest involvement</b></td><td>NO training while symptomatic. Resume Z1 only when 24h fever-free. "Above the neck" rule has limited support — when in doubt, REST.</td><td>Schwellnus 2016 BJSM consensus on illness in athletes</td></tr>
            <tr><td><b>Mild injury (1–2 wk)</b></td><td>Maintain aerobic fitness via cross-training (cycle / swim / pool run) at equivalent HR for equivalent time. Detraining is minimal in ≤2 wk.</td><td>Mujika 2000 <i>IJSPP</i> detraining review</td></tr>
            <tr><td><b>Significant injury (&gt;2 wk)</b></td><td>See physiotherapist. Consider downgrading Fuji to "B-effort". The Bangkok Half becomes an assessment race, not a goal.</td><td><i>Clinical practice</i></td></tr>
            <tr><td><b>Plateau — no improvement 4+ wk · sleep poor · RHR ↑ unexplained</b></td><td>Signs of functional overreaching. Take 5–7 days complete rest + sleep extension. Resume at 50% volume. If symptoms persist &gt;2 wk → likely OTS.</td><td>Meeusen 2013 MSSE consensus on overtraining</td></tr>
            <tr><td><b>Travel disruption (work / family)</b></td><td>Maintain Z1 base only. Skip quality rather than do bad quality. 1 wk travel = minimal fitness loss.</td><td><i>Coaching practice</i></td></tr>
            <tr><td><b>ACWR &gt; 1.5 (Dashboard)</b></td><td>Reduce load by 30% next week. Drop optional Hyrox prep overlay if active.</td><td>Gabbett 2016 <i>BJSM</i></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ============ K12 · GLOSSARY ============ -->
    <div class="card mb-16">
      <div class="k-head"><span class="k-index">K12</span><div class="k-titles"><div class="k-title">Glossary — why this works</div><div class="k-meta">Core terms · peer-reviewed sources</div></div></div>
      <div class="small muted mt-12" style="line-height:1.6">Core terms used throughout this app, with peer-reviewed sources for each. If a term seems vague in the plan, look it up here.</div>
      <div class="knowledge-grid mt-16">
        <div class="term-card">
          <div class="term-name">VO₂max</div>
          <div class="term-def">Maximal rate of oxygen consumption during incremental exercise. Genetic ceiling + ~15–20% trainable. Key driver of "engine size" but plateaus quickly in trained athletes.</div>
          <div class="term-cite">Saltin & Calbet 2006 J Appl Physiol</div>
        </div>
        <div class="term-card">
          <div class="term-name">VT1 / LT1 (Aerobic threshold)</div>
          <div class="term-def">First inflection where blood lactate begins rising above baseline (~2 mmol/L). Upper limit of pure fat-oxidation zone. James: HR 155.</div>
          <div class="term-cite">Skinner & McLellan 1980 Res Q Exerc Sport</div>
        </div>
        <div class="term-card">
          <div class="term-name">VT2 / LT2 (Anaerobic threshold)</div>
          <div class="term-def">Second inflection where lactate accumulates exponentially (~4 mmol/L). Maximum sustainable steady-state intensity (~30–60 min). James: HR 171.</div>
          <div class="term-cite">Beaver et al. 1986 J Appl Physiol</div>
        </div>
        <div class="term-card">
          <div class="term-name">vVO₂max</div>
          <div class="term-def">Velocity at which VO₂max is reached. Used to prescribe VO₂max intervals (3–5 min @ 95–100% vVO₂max). James: 13.9 km/h (4:19/km).</div>
          <div class="term-cite">Billat 2001 Sports Med</div>
        </div>
        <div class="term-card">
          <div class="term-name">VLamax</div>
          <div class="term-def">Maximal rate of lactate accumulation (glycolytic capacity). LOWER VLamax = better fat oxidation at marathon pace. Marathon-specific lever.</div>
          <div class="term-cite">Mader 1986 Int J Sports Med · Heuberger 2018 review</div>
        </div>
        <div class="term-card">
          <div class="term-name">Fractional Utilization (%VO₂max)</div>
          <div class="term-def">% of VO₂max sustainable for race duration. Marathon runners typically sustain 75–85%. Trainable via tempo + threshold work.</div>
          <div class="term-cite">Joyner & Coyle 2008 J Physiol</div>
        </div>
        <div class="term-card">
          <div class="term-name">Running Economy (RE)</div>
          <div class="term-def">O₂ cost at submaximal pace. Better RE = less energy at any speed. Most trainable lever for someone with VO₂max ceiling. Improved by HL strength + plyometrics + technique.</div>
          <div class="term-cite">Saunders 2004 Sports Med · Llanos-Lagos 2024 Sports Med MA</div>
        </div>
        <div class="term-card">
          <div class="term-name">Mitochondrial Density</div>
          <div class="term-def">Number/size of mitochondria per muscle fiber. Z1 volume primary stimulus. Determines aerobic capacity at cellular level.</div>
          <div class="term-cite">Holloszy 1967 J Biol Chem · Hawley 2014 Cell</div>
        </div>
        <div class="term-card">
          <div class="term-name">Capillary Density</div>
          <div class="term-def">Capillaries per muscle fiber. Improves O₂ delivery + lactate clearance. Z1/Z2 stimulus.</div>
          <div class="term-cite">Hoppeler et al. 1985 J Appl Physiol</div>
        </div>
        <div class="term-card">
          <div class="term-name">Lactate Shuttle</div>
          <div class="term-def">Lactate is transported between cells/tissues as fuel + signaling — not waste. Hard work increases shuttle capacity (lactate clearance).</div>
          <div class="term-cite">Brooks 2009 J Physiol · 2018 Cell Metab</div>
        </div>
        <div class="term-card">
          <div class="term-name">Cardiac Drift</div>
          <div class="term-def">HR rises at constant pace over time due to plasma-volume loss, thermal stress, glycogen depletion. Inverse marker of aerobic durability.</div>
          <div class="term-cite">Coyle 2005 Sports Med</div>
        </div>
        <div class="term-card">
          <div class="term-name">Aerobic Decoupling</div>
          <div class="term-def">Ratio of HR to pace drift between 1st and 2nd half of long run. Coaching heuristic: &lt;5% = good durability. Mechanism = cardiac drift.</div>
          <div class="term-cite">Friel framework · mechanism Coyle 2005</div>
        </div>
        <div class="term-card">
          <div class="term-name">Polarized TID</div>
          <div class="term-def">~80% Z1 / ~5% Z2 / ~15% Z3 distribution. Strong evidence for VO₂max gain. Best for sub-elite + shorter events.</div>
          <div class="term-cite">Stöggl & Sperlich 2014 Front Physiol · Muñoz 2014 IJSPP</div>
        </div>
        <div class="term-card">
          <div class="term-name">Pyramidal TID</div>
          <div class="term-def">~80% Z1 / ~15% Z2 / ~5% Z3. What world-class marathoners actually do — race specificity wins late-season.</div>
          <div class="term-cite">Casado 2022 IJSPP review</div>
        </div>
        <div class="term-card">
          <div class="term-name">ACWR</div>
          <div class="term-def">Acute (7d) ÷ chronic (28d) workload ratio. Sweet spot 0.8–1.3. &gt;1.5 = significantly elevated injury risk.</div>
          <div class="term-cite">Gabbett 2016 BJSM</div>
        </div>
        <div class="term-card">
          <div class="term-name">Block Periodization (POL→PYR)</div>
          <div class="term-def">Sequential blocks with different TID emphasis (e.g. polarized in Phase 1, pyramidal in Phase 3). Outperforms static TID by ~2.4% TT.</div>
          <div class="term-cite">Filipas 2021 MSSE · Esteve-Lanao 2017 IJSPP</div>
        </div>
      </div>
    </div>
  `;
}

function isStravaTrainingActivity(activity){
  const sport=String(activity.sportType||"");
  return ["Run","TrailRun","VirtualRun","Workout"].includes(sport);
}

function typeFromStravaActivity(activity, planned){
  if(planned && planned.type && planned.type!=="rest")return planned.type;
  const sport=String(activity.sportType||"");
  if(sport==="TrailRun")return "long_run";
  if(sport==="Workout")return "speed";
  return "easy_z1";
}

function stravaActivityNotes(activity){
  const parts=[`Strava: ${activity.name}`];
  if(activity.avgWatts)parts.push(`power ${activity.avgWatts}W`);
  if(activity.weightedWatts)parts.push(`weighted ${activity.weightedWatts}W`);
  if(activity.avgCadence)parts.push(`cadence ${activity.avgCadence}`);
  if(activity.elevationGain)parts.push(`gain +${activity.elevationGain}m`);
  if(activity.maxHR)parts.push(`max HR ${activity.maxHR}`);
  if(activity.url)parts.push(activity.url);
  return parts.join(" · ");
}

function stravaActivitiesForPicker(activities){
  return (activities||[])
    .filter(isStravaTrainingActivity)
    .slice()
    .sort((a,b)=>String(b.startDateLocal||b.startDate||b.localDate||"").localeCompare(String(a.startDateLocal||a.startDate||a.localDate||"")));
}

function stravaActivityDateLabel(activity){
  const raw=activity.startDateLocal||activity.startDate||activity.localDate||"";
  if(!raw)return "No date";
  const date=raw.slice(0,10);
  const time=raw.includes("T")?raw.slice(11,16):"";
  const parsed=parseISO(date);
  return `${fmtShort(parsed)}${time?` · ${time}`:""}`;
}

function stravaActivityMeta(activity){
  const parts=[];
  if(activity.sportType)parts.push(activity.sportType);
  if(activity.distanceKm)parts.push(`${Number(activity.distanceKm).toFixed(1)} km`);
  if(activity.durationMin)parts.push(`${activity.durationMin} min`);
  if(activity.pace)parts.push(`${activity.pace}/km`);
  if(activity.avgHR)parts.push(`HR ${activity.avgHR}`);
  if(activity.avgWatts)parts.push(`${activity.avgWatts}W`);
  return parts.join(" · ");
}

function sessionPatchFromStravaActivity(activity,planned,existing={}){
  return {
    ...existing,
    source:"strava",
    stravaId:String(activity.id),
    stravaName:activity.name,
    stravaSport:activity.sportType,
    stravaUrl:activity.url,
    stravaStartDate:activity.startDateLocal||activity.startDate||"",
    type:typeFromStravaActivity(activity,planned),
    title:planned.title||activity.name,
    actualDuration:activity.durationMin||planned.duration||"",
    elapsedDuration:activity.elapsedMin||"",
    actualDistance:activity.distanceKm?Number(activity.distanceKm).toFixed(1):"",
    pace:activity.pace||"",
    avgHR:activity.avgHR||"",
    maxHR:activity.maxHR||"",
    avgWatts:activity.avgWatts||"",
    weightedWatts:activity.weightedWatts||"",
    elevationGain:activity.elevationGain||"",
    cadence:activity.avgCadence||existing.cadence||"",
    hrTarget:planned.hrTarget||existing.hrTarget||"",
    notes:stravaActivityNotes(activity)
  };
}

function bestStravaActivitiesByDate(activities){
  const byDate=new Map();
  activities.filter(isStravaTrainingActivity).forEach(activity=>{
    if(!activity.localDate)return;
    const current=byDate.get(activity.localDate);
    if(!current || (activity.durationMin||0)>(current.durationMin||0))byDate.set(activity.localDate,activity);
  });
  return [...byDate.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
}

function applyStravaActivitiesToSessions(activities){
  const log=Store.get(STORAGE.sessions,{});
  const summary={
    imported:0,updated:0,duplicates:0,manualSkipped:0,outsidePlan:0,ignored:0,total:activities.length,
    examples:[]
  };
  const picked=bestStravaActivitiesByDate(activities);
  summary.ignored=Math.max(0,activities.filter(isStravaTrainingActivity).length-picked.length);

  picked.forEach(([date,activity])=>{
    const dateObj=parseISO(date);
    if(Number.isNaN(dateObj.getTime())){summary.ignored++;return;}
    const weekIndex=weekIndexForDate(dateObj);
    if(weekIndex<1||weekIndex>ATHLETE.totalWeeks){summary.outsidePlan++;return;}

    const dayIndex=(dateObj.getUTCDay()+6)%7;
    const planned=PLAN[weekIndex-1]?.days?.[dayIndex];
    if(!planned){summary.outsidePlan++;return;}

    const existing=log[date]||{};
    const importedBefore=String(existing.stravaId||"")===String(activity.id);
    if(importedBefore){summary.duplicates++;return;}
    if(existing.status && existing.source!=="strava"){summary.manualSkipped++;return;}

    const isUpdate=existing.source==="strava";
    const entry=sessionPatchFromStravaActivity(activity,planned,{
      ...existing,
      status:"done",
    });
    log[date]=entry;
    if(isUpdate)summary.updated++;
    else summary.imported++;
    if(summary.examples.length<4){
      const km=Number(activity.distanceKm||0).toFixed(1);
      summary.examples.push(`${fmtShort(dateObj)} · ${km} km · ${activity.durationMin||0} min`);
    }
  });

  Store.set(STORAGE.sessions,log);
  const syncState=Store.get(STORAGE.strava,{});
  Store.set(STORAGE.strava,{
    ...syncState,
    lastSync:new Date().toISOString(),
    lastSummary:summary,
    activities:compactStravaActivities(activities,syncState.activities||[])
  });
  return summary;
}

/* Keep a compact copy of every run (not just the one matched per day) so the load guard
   can see real weekly kilometres, including weeks before the plan started. */
function compactStravaActivities(activities,previous){
  const byId=new Map((previous||[]).map(a=>[String(a.id),a]));
  (activities||[]).filter(isStravaTrainingActivity).forEach(a=>{
    byId.set(String(a.id),{
      id:String(a.id),name:a.name,sportType:a.sportType,localDate:a.localDate,
      distanceKm:Number(a.distanceKm)||0,durationMin:Number(a.durationMin)||0,elapsedMin:Number(a.elapsedMin)||0,
      avgHR:a.avgHR||null,avgCadence:a.avgCadence||null,pace:a.pace||"",
      intel:(byId.get(String(a.id))||{}).intel||null
    });
  });
  return [...byId.values()].sort((a,b)=>String(a.localDate).localeCompare(String(b.localDate))).slice(-400);
}

function applyStravaActivitiesToArchive(activities){
  const archiveLog=Store.get(STORAGE.archiveSessions,{});
  const summary={imported:0,updated:0,duplicates:0,manualSkipped:0,outsideArchive:0,ignored:0,skipped:0,total:activities.length};
  const picked=bestStravaActivitiesByDate(activities);
  summary.ignored=Math.max(0,activities.filter(isStravaTrainingActivity).length-picked.length);

  picked.forEach(([date,activity])=>{
    if(!isLegacyArchiveDateKey(date)){summary.outsideArchive++;return;}
    const existing=archiveLog[date]||{};
    const importedBefore=String(existing.stravaId||"")===String(activity.id);
    if(importedBefore){summary.duplicates++;return;}
    if(existing.status && existing.source!=="strava"){summary.manualSkipped++;return;}

    const longRun=archive32LongRuns({}).find(row=>row.date===date);
    const planned={
      title:longRun?.title||activity.name||"Archived Strava activity",
      duration:longRun?.plannedDuration||activity.durationMin||"",
      type:longRun?.type||"easy_z1",
      hrTarget:longRun?.type==="tune_race"?"race effort":""
    };
    const isUpdate=existing.source==="strava";
    archiveLog[date]={
      ...sessionPatchFromStravaActivity(activity,planned,{...existing,status:"done"}),
      archivePlan:"legacy-32-week",
      archiveWeek:longRun?.week||""
    };
    if(isUpdate)summary.updated++;
    else summary.imported++;
  });

  summary.skipped=summary.duplicates+summary.manualSkipped+summary.outsideArchive+summary.ignored;
  Store.set(STORAGE.archiveSessions,archiveLog);
  const syncState=Store.get(STORAGE.strava,{});
  Store.set(STORAGE.strava,{
    ...syncState,
    lastArchiveSync:new Date().toISOString(),
    lastArchiveSummary:summary
  });
  return summary;
}

async function stravaFetch(path,options={}){
  if(location.protocol==="file:")throw new Error("Open the deployed Vercel app to connect Strava.");
  const res=await fetch(path,{
    credentials:"include",
    ...options,
    headers:{...(options.headers||{})}
  });
  const data=await res.json().catch(()=>({ok:false,error:"Invalid response from Strava API"}));
  if(!res.ok||data.ok===false)throw new Error(data.error||"Strava request failed");
  return data;
}

function stravaAthleteLabel(meta){
  const athlete=meta?.athlete||{};
  const name=[athlete.firstname,athlete.lastname].filter(Boolean).join(" ").trim();
  return name||athlete.username||"Connected athlete";
}

function syncSummaryMarkup(summary){

        <div class="sync-stat"><div class="sync-stat-num" style="color:var(--text-2)">${summary.outsidePlan||0}</div><div class="sync-stat-label">Outside plan</div></div>
      </div>

async function syncStravaActivities(){
  const btn=document.getElementById("btn-strava-sync");
  if(btn){btn.disabled=true;btn.textContent="Syncing...";}
  try{
    const data=await stravaFetch("/api/strava/activities?days=90");
    const summary=applyStravaActivitiesToSessions(data.activities||[]);
    let analyzed=0;
    try{analyzed=await enrichLongRunIntel(4);}catch(_){}
    flash(`Strava sync: ${summary.imported} imported, ${summary.updated} updated${analyzed?`, ${analyzed} long run${analyzed===1?"":"s"} analyzed`:""}`);
    renderSettings();
  }catch(err){
    alert(err.message||"Strava sync failed");
    renderStravaSettings();
  }
}

/* Fetch down-sampled streams for long runs (≥15 km) that have not been analyzed yet and
   store stop%, cadence decay and HR drift next to the activity and the matching session. */
async function enrichLongRunIntel(limit=6){
  const st=Store.get(STORAGE.strava,{});
  const acts=st.activities||[];
  const todo=acts.filter(a=>RUN_SPORTS.includes(a.sportType)&&a.distanceKm>=15&&!a.intel).slice(-limit);
  let done=0;
  for(const a of todo){
    try{
      const data=await stravaFetch(`/api/strava/streams?id=${encodeURIComponent(a.id)}&points=400`);
      const intel=FujiIntel.analyzeStreams(data.streams||{});
      if(!intel)continue;
      a.intel=intel;done++;
      const log=Store.get(STORAGE.sessions,{});
      const hit=Object.entries(log).find(([d,lg])=>lg&&String(lg.stravaId)===String(a.id));
      if(hit){log[hit[0]]={...hit[1],intel,elapsedDuration:hit[1].elapsedDuration||Math.round(intel.elapsedSec/60)};Store.set(STORAGE.sessions,log);}
    }catch(err){console.warn("[intel]",a.id,err.message);}
  }
  Store.set(STORAGE.strava,{...Store.get(STORAGE.strava,{}),activities:acts,lastIntel:new Date().toISOString()});
  return done;
}

async function disconnectStrava(){
  if(!confirm("Disconnect Strava from this browser?"))return;
  try{
    await stravaFetch("/api/strava/disconnect",{method:"POST"});
    const local=Store.get(STORAGE.strava,{});
    Store.set(STORAGE.strava,{...local,disconnectedAt:new Date().toISOString()});
    flash("Strava disconnected");
    renderSettings();
  }catch(err){
    alert(err.message||"Could not disconnect Strava");
  }
}

/* =========================================================================
   20. UTILITIES
   ========================================================================= */
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);}

// Map a session-type string to a primary HR zone bucket.
// Used so TID% reflects what the user actually did, not the planned session
// (e.g. user logs "modified" and changes easy_z1 → speed).
function typeToZone(t){
  if(!t)return null;
  if(t==="easy_z1"||t==="recovery"||t==="long_run"||t==="bike"||t==="walk_run")return "z1";
  if(t==="mp_long"||t==="tune_race")return "z2";
  if(t==="hill")return "mixed";
  if(t==="speed"||t==="strength_a"||t==="strength_b"||t==="rest")return null; // fall back to planned
  return null;
}
function zoneForLog(lg,planned){
  // The session modal saves the actually-performed session type as `lg.type`.
  // When the user logs "modified" + changes type, prefer that for TID%.
  if(lg && lg.type){
    const z=typeToZone(lg.type);
    if(z)return z;
  }
  return planned ? planned.zone : null;
}
function flash(msg){
  const f=document.createElement("div");
  f.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-2px;margin-right:6px;color:#34D399"><polyline points="20 6 9 17 4 12"/></svg>${msg}`;
  f.style.cssText="position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,30,34,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;padding:12px 22px;border-radius:999px;border:1px solid #26262B;z-index:200;font-size:13px;font-weight:600;letter-spacing:-0.005em;box-shadow:0 12px 32px rgba(0,0,0,0.5);opacity:0;transition:all 0.3s cubic-bezier(0.32,0.72,0,1)";
  document.body.appendChild(f);
  requestAnimationFrame(()=>{f.style.opacity="1";f.style.transform="translateX(-50%) translateY(0)";});
  setTimeout(()=>{f.style.opacity="0";f.style.transform="translateX(-50%) translateY(10px)";setTimeout(()=>f.remove(),300);},2000);
}

/* =========================================================================

   ========================================================================= */
let __countdownTimer=null;
function init(){
  State.init();
  setupMobileChrome();
  renderNav();
  renderCountdown();
  // Storage unavailable → show a non-blocking banner once per tab.
  if(!__storageOK && !sessionStorage.getItem("__fuji_storage_warned")){
    try{ sessionStorage.setItem("__fuji_storage_warned","1"); }catch(_){}
    showStorageWarning();
  }
  // First-run welcome (skip if storage is broken — would re-show every load)
  if(__storageOK && !Store.get("fuji_first_run",false)){
    showWelcome();
    Store.set("fuji_first_run",true);
  }
  const urlParams=new URLSearchParams(window.location.search);
  const stravaResult=urlParams.get("strava");
  if(stravaResult){
    switchView("settings");
    if(stravaResult==="connected")flash("Strava connected");
    else if(stravaResult==="denied")flash("Strava connection cancelled");
    else if(stravaResult==="setup")flash("Add Strava API keys in Vercel before connecting");
    window.history.replaceState({},document.title,window.location.pathname+window.location.hash);
  }else{
    switchView(isMobileLayout()?"today":"weekly");
  }
  setupTopbarScroll();
  // Recompute countdown hourly. Clear any prior timer in case init runs twice.
  if(__countdownTimer)clearInterval(__countdownTimer);
  __countdownTimer=setInterval(renderCountdown,3600000);
}

  b.innerHTML='<span style="font-size:16px">⚠️</span><span style="flex:1">Storage unavailable — logs won’t persist (Private Mode?). Export JSON if you need to keep data.</span><button aria-label="Dismiss" style="background:transparent;border:none;color:#fff;font-size:18px;cursor:pointer;padding:0 4px">×</button>';

}

   PWA · Service Worker registration (offline cache)
   Requires sw.js at site root · works on Vercel/Netlify/GH Pages

if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1")){
