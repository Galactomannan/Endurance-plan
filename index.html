<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#060709">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Endurance">
<meta name="mobile-web-app-capable" content="yes">
<title>Endurance 2026</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/app.css">
<script src="js/plan-spec.js"></script>
<script src="js/plan-engine.js"></script>
<script src="js/strength-program.js"></script>
<script src="js/intel.js"></script>
<script src="js/store.js"></script>
<script src="js/strava-sync.js"></script>
<script src="js/records.js"></script>
</head>
<body>
<div id="app">
  <aside id="sidebar" aria-label="Navigation">
    <div class="brand">Endurance 2026<small>Road to Fuji</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="sb-count">
      <div class="n" id="sb-days">—</div>
      <div class="l">days to Fuji</div>
      <div class="s" id="sb-meta"></div>
    </div>
  </aside>
  <main id="main">
    <div class="view" data-view="today" id="view-today"></div>
    <div class="view" data-view="plan" id="view-plan"></div>
    <div class="view" data-view="data" id="view-data"></div>
    <div class="view" data-view="race" id="view-race"></div>
    <div class="view" data-view="strength" id="view-strength"></div>
    <div class="view" data-view="athlete" id="view-athlete"></div>
    <div class="view" data-view="archive" id="view-archive"></div>
    <div class="view" data-view="evidence" id="view-evidence"></div>
    <div class="view" data-view="settings" id="view-settings"></div>
  </main>
</div>
<header class="topbar" id="topbar" aria-hidden="true"><span id="topbar-title"></span></header>
<nav class="tabs" id="tabs" aria-label="Tabs"></nav>
<div id="sheet-root"></div>
<noscript><p style="padding:40px 22px;font:15px -apple-system,system-ui,sans-serif;color:#F4F5F7;background:#060709">This app needs JavaScript. Enable it and reload.</p></noscript>

<script>
'use strict';

/* =========================================================================
   1. CONSTANTS
   ========================================================================= */
const PLAN_SPEC = FUJI_PLAN_SPEC;
const { STORAGE } = FujiStore;
const ATHLETE = { ...PLAN_SPEC.athlete, planStart: PLAN_SPEC.startDate, totalWeeks: PLAN_SPEC.totalWeeks };
const COURSE = PLAN_SPEC.race;
const RACE_HALF = PLAN_SPEC.races.find(r => r.id === "atmbkk");
const RACE_FUJI = PLAN_SPEC.races.find(r => r.id === "fuji");
const RACES_DONE = PLAN_SPEC.races.filter(r => r.status === "done");
const PACES = PLAN_SPEC.paces;
const GUARDS = PLAN_SPEC.guards;

const TYPE_NAME = { easy_z1: "Easy run", walk_run: "Walk-run", speed: "Cruise intervals", hill: "Hills", long_run: "Long run", mp_long: "Long run · goal pace", tune_race: "Race", strength_a: "Strength A", strength_b: "Strength B", recovery: "Shakeout", rest: "Rest", bike: "Bike" };
const LOG_TYPES = ["easy_z1", "walk_run", "long_run", "mp_long", "speed", "hill", "bike", "recovery", "tune_race", "strength_a", "strength_b", "rest"];

/* =========================================================================
   2. STORE
   ========================================================================= */
const Store = FujiStore.createStore((() => {
  try { return window.localStorage; }
  catch (_) { return { getItem() { throw new Error("no storage"); }, setItem() { throw new Error("no storage"); }, removeItem() {} }; }
})());
function getSettings() { const s = Store.get(STORAGE.settings, {}); return FujiStore.isPlainRecord(s) ? s : {}; }
function patchSettings(patch) { Store.set(STORAGE.settings, { ...getSettings(), ...patch }); }
function sessionsLog() { const s = Store.get(STORAGE.sessions, {}); return FujiStore.isPlainRecord(s) ? s : {}; }
function stravaState() { const s = Store.get(STORAGE.strava, {}); return FujiStore.isPlainRecord(s) ? s : {}; }
function stravaActs() { return Array.isArray(stravaState().activities) ? stravaState().activities : []; }
function strengthLog() { const s = Store.get(STORAGE.strength, []); return Array.isArray(s) ? s : []; }
function readinessLog() { const s = Store.get(STORAGE.readiness, {}); return FujiStore.isPlainRecord(s) ? s : {}; }
const isDone = lg => !!lg && (lg.status === "done" || lg.status === "modified");

/* =========================================================================
   3. DATES — calendar dates anchored to UTC midnight (DST/timezone safe)
   ========================================================================= */
const DAY = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const DAY_FULL = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function parseISO(s) { const [y, m, d] = String(s).split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); }
function fmtISO(d) { return d.toISOString().slice(0, 10); }
function addDays(d, n) { const x = new Date(d); x.setUTCDate(x.getUTCDate() + n); return x; }
function fmtShort(d) { return d.getUTCDate() + " " + MON[d.getUTCMonth()]; }
function fmtDay(d) { return DAY[(d.getUTCDay() + 6) % 7] + " " + fmtShort(d); }
function fmtLong(d) { return DAY_FULL[(d.getUTCDay() + 6) % 7] + ", " + fmtShort(d) + " " + d.getUTCFullYear(); }
const TODAY_OVERRIDE = (() => { const t = new URLSearchParams(location.search).get("today"); return /^\d{4}-\d{2}-\d{2}$/.test(t || "") ? t : null; })();
function todayUTC() {
  if (TODAY_OVERRIDE) return parseISO(TODAY_OVERRIDE);
  const n = new Date();
  return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()));
}
function todayISO() { return fmtISO(todayUTC()); }
function daysUntil(iso) { return Math.round((parseISO(iso) - todayUTC()) / 86400000); }
function dowOf(d) { return (d.getUTCDay() + 6) % 7; }
function weekIndexForDate(d) { return Math.floor(Math.floor((d - parseISO(ATHLETE.planStart)) / 86400000) / 7) + 1; }
function dateForWeekDay(w, d) { return addDays(parseISO(ATHLETE.planStart), (w - 1) * 7 + d); }

/* =========================================================================
   4. PLAN — data (js/plan-spec.js) turned into dated weeks by js/plan-engine.js
   ========================================================================= */
function planGateDate() {
  const g = getSettings().gateDate;
  return /^\d{4}-\d{2}-\d{2}$/.test(g || "") ? g : PLAN_SPEC.startDate;
}
let PLAN_OBJ, PLAN, PHASES, SESSION_BY_DATE;
function rebuildPlan() {
  PLAN_OBJ = FujiPlanEngine.buildPlan(PLAN_SPEC, { gateDate: planGateDate() });
  PLAN = PLAN_OBJ.weeks;
  PHASES = PLAN_OBJ.phases;
  SESSION_BY_DATE = new Map();
  PLAN.forEach(w => w.days.forEach((s, d) => SESSION_BY_DATE.set(s.date, { w: w.weekNum, d, s, week: w })));
}
rebuildPlan();
function sessionAt(date) { return SESSION_BY_DATE.get(date) || null; }
function currentWeekIndex() { const wi = weekIndexForDate(todayUTC()); return Math.max(1, Math.min(ATHLETE.totalWeeks, wi)); }
function inPlanWindow() { const wi = weekIndexForDate(todayUTC()); return wi >= 1 && wi <= ATHLETE.totalWeeks; }
function raceShort(id) { const r = PLAN_SPEC.races.find(x => x.id === id); return r ? r.short : id; }

/* =========================================================================
   5. STATE
   ========================================================================= */
const State = {
  view: "today", week: 1, strengthWeek: null, scroll: {},
  init() { this.week = currentWeekIndex(); this.strengthWeek = null; }
};

/* =========================================================================
   6. ICONS
   ========================================================================= */
const _svg = p => `<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const I = {
  sun: () => _svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>'),
  cal: () => _svg('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  bars: () => _svg('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  flag: () => _svg('<path d="M5 21V4M5 4h13l-2 5 2 5H5"/>'),
  more: () => _svg('<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'),
  dumb: () => _svg('<path d="M2 12h2M20 12h2M6 8v8M18 8v8M9 7v10M15 7v10M9 12h6"/>'),
  person: () => _svg('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>'),
  box: () => _svg('<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>'),
  book: () => _svg('<path d="M4 19.5A2.5 2.5 0 016.5 17H20V2H6.5A2.5 2.5 0 004 4.5v15z"/><path d="M4 4.5v15"/>'),
  gear: () => _svg('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'),
  check: () => _svg('<path d="M5 12l4 4 10-10"/>'),
  right: () => _svg('<path d="M9 6l6 6-6 6"/>'),
  left: () => _svg('<path d="M15 6l-6 6 6 6"/>'),
  close: () => _svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  plus: () => _svg('<path d="M12 5v14M5 12h14"/>'),
  shield: () => _svg('<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/>'),
  trend: () => _svg('<path d="M3 18l6-9 4 5 3-3 5 7z"/>'),
  heart: () => _svg('<path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 000-7.8z"/>'),
  play: () => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>`
};
const NAV = [
  { id: "today", label: "Today", icon: I.sun },
  { id: "plan", label: "Plan", icon: I.cal },
  { id: "data", label: "Data", icon: I.bars },
  { id: "race", label: "Race", icon: I.flag },
  { id: "strength", label: "Strength", icon: I.dumb },
  { id: "athlete", label: "Athlete", icon: I.person },
  { id: "archive", label: "Archive", icon: I.box },
  { id: "evidence", label: "Evidence", icon: I.book },
  { id: "settings", label: "Settings", icon: I.gear }
];
const TABS = ["today", "plan", "data", "race", "more"];

/* =========================================================================
   7. SHELL — navigation, sheets, toasts
   ========================================================================= */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => [...(root || document).querySelectorAll(sel)];
function isPhone() { return window.matchMedia("(max-width:819px)").matches; }

function renderNav() {
  const nav = $("#nav");
  nav.innerHTML = NAV.map((n, i) => `${i === 4 ? '<div class="gap"></div>' : ""}<button type="button" class="${State.view === n.id ? "on" : ""}" data-nav="${n.id}" aria-current="${State.view === n.id ? "page" : "false"}">${n.icon()}<span>${n.label}</span></button>`).join("");
  $$("[data-nav]", nav).forEach(b => b.addEventListener("click", () => switchView(b.dataset.nav)));
  const tabs = $("#tabs");
  const moreOn = !TABS.includes(State.view);
  tabs.innerHTML = TABS.map(id => {
    if (id === "more") return `<button type="button" class="tab ${moreOn ? "on" : ""}" data-nav="more" aria-label="More">${I.more()}<span>More</span></button>`;
    const n = NAV.find(x => x.id === id);
    return `<button type="button" class="tab ${State.view === id ? "on" : ""}" data-nav="${id}" aria-current="${State.view === id ? "page" : "false"}">${n.icon()}<span>${n.label}</span></button>`;
  }).join("");
  $$("[data-nav]", tabs).forEach(b => b.addEventListener("click", () => b.dataset.nav === "more" ? openMore() : switchView(b.dataset.nav)));
}
function renderCountdown() {
  const days = Math.max(0, daysUntil(RACE_FUJI.date));
  $("#sb-days").textContent = days;
  const wi = weekIndexForDate(todayUTC());
  const hd = daysUntil(RACE_HALF.date);
  $("#sb-meta").textContent = `${inPlanWindow() ? `W${wi} of ${ATHLETE.totalWeeks}` : wi < 1 ? "before W1" : "season done"} · half ${hd >= 0 ? hd + " d" : "done"}`;
}
const VIEWS = {};
function switchView(id) {
  if (!VIEWS[id]) return;
  if (isPhone()) State.scroll[State.view] = window.scrollY;
  State.view = id;
  $$(".view").forEach(v => v.classList.toggle("active", v.dataset.view === id));
  renderNav();
  VIEWS[id]();
  $("#topbar-title").textContent = (NAV.find(n => n.id === id) || {}).label || "";
  closeSheet();
  window.scrollTo({ top: isPhone() ? (State.scroll[id] || 0) : 0, behavior: "instant" });
}
function rerender() { if (VIEWS[State.view]) VIEWS[State.view](); renderCountdown(); }
function setupTopbar() {
  const tb = $("#topbar");
  const sync = () => tb.classList.toggle("scrolled", window.scrollY > 56);
  window.addEventListener("scroll", sync, { passive: true }); sync();
}
function openMore() {
  const items = NAV.filter(n => !TABS.includes(n.id));
  showSheet(`
    <div class="sheet-h"><div class="t">More</div></div>
    <div class="sheet-b"><div class="rows">${items.map(n => `<button type="button" class="r act" data-go="${n.id}"><span class="ic">${n.icon()}</span><div class="body"><div class="t">${n.label}</div></div><span class="chev">${I.right()}</span></button>`).join("")}</div></div>`, { small: true });
  $$("#sheet-root [data-go]").forEach(b => b.addEventListener("click", () => switchView(b.dataset.go)));
}

/* sheets: bottom sheet on the phone, dialog on the desk */
let __lockY = 0, __lastFocus = null;
function showSheet(html, opts = {}) {
  const root = $("#sheet-root");
  const wasOpen = !!root.firstChild;
  if (!wasOpen) __lastFocus = document.activeElement;
  root.innerHTML = `<div class="sheet-bg"></div><div class="sheet ${opts.small ? "small" : ""}" role="dialog" aria-modal="true">${html}</div>`;
  $(".sheet-bg", root).addEventListener("click", closeSheet);
  $$(".sheet-close", root).forEach(b => b.addEventListener("click", closeSheet));
  if (!wasOpen) {
    __lockY = window.scrollY;
    document.body.style.position = "fixed"; document.body.style.top = `-${__lockY}px`; document.body.style.left = "0"; document.body.style.right = "0";
  }
  [$("#app"), $("#tabs"), $("#topbar")].forEach(el => { if (el) el.inert = true; });
  const first = $(".sheet input:not([type=hidden]),.sheet textarea,.sheet select", root);
  if (first && !isPhone()) first.focus({ preventScroll: true });
}
function closeSheet() {
  const root = $("#sheet-root");
  if (!root.firstChild) return;
  root.innerHTML = "";
  [$("#app"), $("#tabs"), $("#topbar")].forEach(el => { if (el) el.inert = false; });
  document.body.style.position = ""; document.body.style.top = ""; document.body.style.left = ""; document.body.style.right = "";
  window.scrollTo(0, __lockY);
  if (__lastFocus && __lastFocus.isConnected) { try { __lastFocus.focus({ preventScroll: true }); } catch (_) { /* element may be gone */ } }
  __lastFocus = null;
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
function sheetFrame(o) {
  return `<div class="sheet-h"><div class="t">${o.title}</div>${o.sub ? `<div class="x">${o.sub}</div>` : ""}</div>
    <div class="sheet-b">${o.body}</div>${o.foot ? `<div class="sheet-f">${o.foot}</div>` : ""}`;
}
function confirmSheet(text, ok = "Confirm") {
  return new Promise(resolve => {
    showSheet(sheetFrame({ title: "Are you sure?", body: `<p class="copy">${text}</p>`, foot: `<button class="btn sheet-close" type="button">Cancel</button><button class="btn pri" id="cf-ok" type="button">${ok}</button>` }), { small: true });
    let done = false;
    const finish = v => { if (done) return; done = true; resolve(v); };
    $("#cf-ok").addEventListener("click", () => { finish(true); closeSheet(); });
    $$("#sheet-root .sheet-close, #sheet-root .sheet-bg").forEach(el => el.addEventListener("click", () => finish(false)));
  });
}
function inputSheet(o) {
  return new Promise(resolve => {
    showSheet(sheetFrame({ title: o.title, sub: o.sub || "", body: `<div class="fields"><div class="f full text"><div class="l">${o.label}</div><input id="in-val" value="${escapeHtml(o.value || "")}" placeholder="${escapeHtml(o.placeholder || "")}" ${o.inputmode ? `inputmode="${o.inputmode}"` : ""}></div></div>`, foot: `<button class="btn sheet-close" type="button">Cancel</button><button class="btn pri" id="in-ok" type="button">Save</button>` }), { small: true });
    let done = false;
    const finish = v => { if (done) return; done = true; resolve(v); };
    $("#in-ok").addEventListener("click", () => { finish($("#in-val").value.trim()); closeSheet(); });
    $("#in-val").addEventListener("keydown", e => { if (e.key === "Enter") { finish($("#in-val").value.trim()); closeSheet(); } });
    $$("#sheet-root .sheet-close, #sheet-root .sheet-bg").forEach(el => el.addEventListener("click", () => finish(null)));
  });
}
let __flashTimer = null;
function flash(msg) {
  $$(".flash").forEach(f => f.remove());
  const f = document.createElement("div");
  f.className = "flash"; f.setAttribute("role", "status"); f.textContent = msg;
  document.body.appendChild(f);
  requestAnimationFrame(() => f.classList.add("in"));
  clearTimeout(__flashTimer);
  __flashTimer = setTimeout(() => { f.classList.remove("in"); setTimeout(() => f.remove(), 300); }, 1800);
}

/* =========================================================================
   8. HELPERS
   ========================================================================= */
function escapeHtml(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
function paceToSec(p) { return FujiRecords.paceToSec(p); }
function fmtPace(sec) { return FujiIntel.fmtPace(sec); }
function calcPace(distKm, durMin) { const d = parseFloat(distKm), m = parseFloat(durMin); return d > 0 && m > 0 ? fmtPace(m * 60 / d) : null; }
function fmtKm(x) { const n = Number(x); return Number.isFinite(n) ? (Math.round(n * 10) / 10).toFixed(1) : "—"; }
function fmtMin(m) { const n = Number(m); if (!Number.isFinite(n) || n <= 0) return "—"; return n >= 60 ? `${Math.floor(n / 60)}:${String(Math.round(n % 60)).padStart(2, "0")} h` : `${Math.round(n)} min`; }
function num(v) { const n = parseFloat(v); return Number.isFinite(n) ? n : null; }
function hrCapText(s) { if (!s.hrTarget || s.hrTarget === "—" || s.hrTarget === "strength") return ""; return `HR ${s.hrTarget.replace(" (Z1)", "")}`; }
function typeName(t) { return TYPE_NAME[t] || t; }
function hasSheet() { return !!$("#sheet-root").firstChild; }
/* the headline number of a session for the dial */
function sessionHeadline(s) {
  if (!s) return { big: "—", unit: "", sub: "" };
  if (s.type === "rest") return { big: "Rest", word: true, unit: "", sub: s.detail.split(" · ")[0] };
  if (s.type === "bike") return { big: String(s.duration), unit: "min · bike Z1", sub: `HR under ${PACES.bike.hrCap} · 85–95 rpm` };
  if (s.type === "strength_a" || s.type === "strength_b") return { big: String(s.duration), unit: `min · strength ${s.type === "strength_a" ? "A" : "B"}`, sub: s.distanceKm ? `then easy ${s.distanceKm} km` : "" };
  const km = s.distanceKm ? (Number.isInteger(s.distanceKm) ? String(s.distanceKm) : String(s.distanceKm)) : String(s.duration);
  const unit = s.distanceKm ? `km · ${typeName(s.type).toLowerCase()}` : `min · ${typeName(s.type).toLowerCase()}`;
  const sub = [s.duration ? `${s.duration} min` : "", hrCapText(s), s.mpKm ? `last ${s.mpKm} km at ${PACES.goal.target}` : ""].filter(Boolean).join(" · ");
  return { big: km, unit, sub };
}
/* pace band text for a run session */
function paceText(s) {
  const f = fmtPace;
  if (!s) return "";
  if (["easy_z1", "long_run"].includes(s.type)) return `${f(PACES.easy.minSec)}–${f(PACES.easy.maxSec)} /km · HR under ${PACES.easy.hrCap}`;
  if (s.type === "mp_long") return `${f(PACES.easy.minSec)}–${f(PACES.easy.maxSec)} /km · last ${s.mpKm} km at ${PACES.goal.target} (HR ≤${PACES.goal.hrCap})`;
  if (s.type === "speed") return `${f(PACES.threshold.minSec)}–${f(PACES.threshold.maxSec)} /km · HR ${PACES.threshold.hrMin}–${PACES.threshold.hrMax}`;
  if (["walk_run", "recovery"].includes(s.type)) return `${f(PACES.recovery.minSec)}–${f(PACES.recovery.maxSec)} /km · HR under ${PACES.recovery.hrCap}`;
  return "";
}
function stripTitle(t) { return String(t).replace(/\s·\s\d+(\.\d+)?\s?km$/, ""); }
function logLine(lg) {
  if (!lg) return "";
  if (lg.status === "skipped") return "skipped";
  const parts = [];
  if (lg.actualDistance) parts.push(`${fmtKm(lg.actualDistance)} km`);
  if (lg.actualDuration) parts.push(`${Math.round(lg.actualDuration)}'`);
  if (lg.pace && lg.type !== "bike") parts.push(`${lg.pace}`);
  if (lg.avgHR) parts.push(`HR ${lg.avgHR}`);
  const sp = stopPctOf(lg);
  if (sp !== null && sp > 0) parts.push(`stops ${sp}%`);
  if (lg.rpe) parts.push(`RPE ${lg.rpe}`);
  if (lg.source === "strava") parts.push("Strava");
  return parts.join(" · ");
}
function stopPctOf(lg) {
  if (lg && lg.intel && lg.intel.stopPct !== null && lg.intel.stopPct !== undefined) return lg.intel.stopPct;
  const mov = num(lg && lg.actualDuration), el = num(lg && lg.elapsedDuration);
  if (mov > 0 && el >= mov) return FujiIntel.stopPct(mov * 60, el * 60);
  return null;
}
function viewHead(o) {
  return `<div class="vh">
    <div class="vh-top"><span class="micro">${o.kicker || ""}</span><span class="micro now"><b>${Math.max(0, daysUntil(RACE_FUJI.date))}</b> → Fuji</span></div>
    <h1>${o.title}</h1>${o.sub ? `<div class="vh-sub">${o.sub}</div>` : ""}${o.actions ? `<div class="vh-actions">${o.actions}</div>` : ""}
  </div>`;
}
function sec(title, right, body) { return `<section class="sec"><div class="sec-h"><h2>${title}</h2>${right ? `<span class="micro">${right}</span>` : ""}</div>${body}</section>`; }
function wire(root, sel, evt, fn) { $$(sel, root).forEach(el => el.addEventListener(evt, e => fn(el, e))); }

/* =========================================================================
   9. TODAY — the plan for the day, what to record before and after
   ========================================================================= */
function displaySession(date) { return sessionAt(date); }
function weekProgress(wIdx) {
  const week = PLAN[wIdx - 1];
  const log = sessionsLog();
  let km = 0, done = 0;
  const planned = week.days.filter(d => d.type !== "rest").length;
  week.days.forEach(d => { const l = log[d.date]; if (isDone(l)) { done++; if (l.actualDistance && l.type !== "bike") km += parseFloat(l.actualDistance) || 0; } });
  return { km: Math.round(km * 10) / 10, done, planned, target: week.targetKm };
}
function nextKeySession(fromDate) {
  for (const w of PLAN) for (const s of w.days) {
    if (!["speed", "hill", "long_run", "mp_long", "tune_race"].includes(s.type) || s.date <= fromDate) continue;
    const l = sessionsLog()[s.date];
    if (isDone(l) || (l && l.status === "skipped")) continue;
    return { w: w.weekNum, s };
  }
  return null;
}
function dialSvg(wIdx, inPlan, progress) {
  const N = PLAN.length, cx = 150, cy = 150, R = 138, r2 = 112, seg = 360 / N, gap = 3.2;
  const pt = (r, a) => { const t = (a - 90) * Math.PI / 180; return [cx + r * Math.cos(t), cy + r * Math.sin(t)]; };
  const arc = (r, a0, a1) => { const [x0, y0] = pt(r, a0), [x1, y1] = pt(r, a1); return `M${x0.toFixed(2)},${y0.toFixed(2)}A${r},${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)},${y1.toFixed(2)}`; };
  const segs = PLAN.map((w, i) => {
    const now = inPlan && w.weekNum === wIdx, past = inPlan ? w.weekNum < wIdx : todayUTC() > parseISO(w.endDate);
    const stroke = now ? "var(--now)" : w.race ? "var(--ink-2)" : past ? "var(--ink-3)" : "var(--ink-4)";
    return `<path d="${arc(R, i * seg + gap / 2, (i + 1) * seg - gap / 2)}" fill="none" stroke="${stroke}" stroke-width="${now ? 7 : 5}" stroke-dasharray="${w.race ? "2 3" : "none"}" opacity="${w.isRecovery && !now ? 0.6 : 1}" ${now ? 'style="filter:drop-shadow(0 0 6px rgba(255,106,26,0.7))"' : ""}/>`;
  }).join("");
  const labels = PLAN.filter(w => w.race).map(w => { const i = w.weekNum - 1; const [x, y] = pt(R + 24, (i + 0.5) * seg); return `<text x="${x.toFixed(1)}" y="${(y + 3.5).toFixed(1)}" text-anchor="middle" font-size="9" font-family="SF Mono, ui-monospace, Menlo, monospace" letter-spacing="1.2" fill="${w.race === "fuji" ? "var(--now)" : "var(--ink-2)"}">${raceShort(w.race).toUpperCase().replace("BKK ", "")}</text>`; }).join("");
  return `<svg viewBox="0 0 300 300" aria-hidden="true">${segs}${labels}
    <path d="${arc(r2, 0, 359.99)}" fill="none" stroke="var(--ink-5)" stroke-width="9"/>
    ${(() => {
      const deg = Math.min(1, Math.max(0, progress)) * 359.99;
      if (deg < 0.6) return "";
      const len = 2 * Math.PI * r2 * (deg / 360);
      return `<path id="dial-prog" d="${arc(r2, 0, deg)}" fill="none" stroke="var(--now)" stroke-width="9" stroke-linecap="round" style="filter:drop-shadow(0 0 6px rgba(255,106,26,0.35))" data-len="${len.toFixed(1)}"/>`;
    })()}
    <line x1="${cx}" y1="${cy - R - 9}" x2="${cx}" y2="${cy - R - 4}" stroke="var(--ink-3)" stroke-width="1"/>
  </svg>`;
}
/* The arc is already drawn at its true length. This only wipes it in, and the
   timer guarantees the clean end state even where rAF never runs (hidden tab). */
function animateDial(root) {
  const p = $("#dial-prog", root); if (!p) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const len = parseFloat(p.dataset.len);
  if (!(len > 0)) return;
  p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
  p.style.transition = "stroke-dashoffset .9s cubic-bezier(0.22,1,0.36,1)";
  requestAnimationFrame(() => { p.style.strokeDashoffset = "0"; });
  setTimeout(() => { if (!p.isConnected) return; p.style.transition = ""; p.style.strokeDasharray = ""; p.style.strokeDashoffset = ""; }, 1100);
}

/* weather: Bangkok forecast → expected easy pace at the HR cap (Ely 2007 heat effect, ±10 %) */
const WX_URL = "https://api.open-meteo.com/v1/forecast?latitude=13.7563&longitude=100.5018&hourly=temperature_2m,relative_humidity_2m,apparent_temperature&timezone=Asia%2FBangkok&forecast_days=1";
async function loadWeather(el, s) {
  if (!el) return;
  try {
    let data = null;
    try { const c = JSON.parse(sessionStorage.getItem("fuji_wx") || "null"); if (c && c.date === new Date().toDateString() && Date.now() - c.ts < 3600e3) data = c.data; } catch (_) { /* ignore */ }
    if (!data) {
      const res = await fetch(WX_URL);
      if (!res.ok) throw new Error("wx");
      data = await res.json();
      try { sessionStorage.setItem("fuji_wx", JSON.stringify({ ts: Date.now(), date: new Date().toDateString(), data })); } catch (_) { /* ignore */ }
    }
    const h = new Date().getHours();
    const idx = h < 9 ? 6 : Math.min(23, h);
    const H = data.hourly || {};
    const temp = Math.round(H.temperature_2m[idx]), rh = Math.round(H.relative_humidity_2m[idx]), app = Math.round(H.apparent_temperature[idx]);
    if (!Number.isFinite(temp)) throw new Error("wx");
    const at = `${String(idx).padStart(2, "0")}:00`;
    let pace = "";
    const band = s && ["easy_z1", "long_run", "mp_long"].includes(s.type) ? PACES.easy : s && ["walk_run", "recovery"].includes(s.type) ? PACES.recovery : null;
    if (band) pace = `<div class="p">${fmtPace(FujiRecords.heatAdjustSec(band.minSec, app))} – ${fmtPace(FujiRecords.heatAdjustSec(band.maxSec, app))}<small>expected · HR under ${band.hrCap}</small></div>`;
    el.innerHTML = `<div class="w"><b>${temp}°</b> · ${rh}% · feels ${app}<br><span class="dim">Bangkok · ${at}${!band ? " · no run today" : ""}</span></div>${pace}`;
    el.hidden = false;
  } catch (_) { el.hidden = true; }
}

function toggleDone(date) {
  const at = sessionAt(date); if (!at) return;

/* =========================================================================
   10. LOG SHEETS — session, strength, rest, body
   ========================================================================= */
function stravaActivityLabel(a) {
  const parts = [];
  if (a.distanceKm) parts.push(`${fmtKm(a.distanceKm)} km`);
  if (a.durationMin) parts.push(`${a.durationMin}'`);
  if (a.elapsedMin && a.elapsedMin !== a.durationMin) parts.push(`elapsed ${a.elapsedMin}'`);
  if (a.avgHR) parts.push(`HR ${a.avgHR}`);
  if (a.pace && !FujiStravaSync.isRide(a)) parts.push(`${a.pace}/km`);
  return parts.join(" · ");
}
function timeOf(a) { const t = String(a.startDateLocal || ""); return t.includes("T") ? t.slice(11, 16) : ""; }

function openLogSheet(date) {
  const disp = displaySession(date);
  const at = disp || { w: 0, d: dowOf(parseISO(date)), s: { type: "easy_z1", title: "Session", duration: 0, detail: "" } };

  if (s.type === "strength_a" || s.type === "strength_b") return openStrengthLog(at.w, s.type === "strength_a" ? "A" : "B", date);
  if (s.type === "rest") return openRestSheet(date);
  const lg = Store.getSession(date) || {};
  const type0 = lg.type || s.type;

  const shoes = Array.isArray(settings.shoes) ? settings.shoes : [];
  let picked = null;
  let list = FujiStravaSync.activitiesForDay(stravaActs(), date, { type: type0 });
  if (lg.source === "strava" && lg.stravaId) {

  }
  let showList = false, extra = [];
  const fld = (id, label, unit, value, opts = {}) => `<div class="f"><div class="l">${label}</div><input id="${id}" type="text" inputmode="${opts.inputmode || "decimal"}" value="${escapeHtml(value ?? "")}" placeholder="${opts.ph || "—"}" autocomplete="off"><div class="u">${unit}</div></div>`;
  const body = `
    <div id="lg-import"></div>
    <div class="fields">

      ${fld("lg-mov", "Moving", "min", lg.actualDuration || "", { inputmode: "numeric" })}
      ${fld("lg-el", "Elapsed", "min · with stops", lg.elapsedDuration || "", { inputmode: "numeric" })}

      ${fld("lg-rpe", "RPE", "1 – 10", lg.rpe || "", { inputmode: "numeric" })}

    </div>
    <div class="calc" id="lg-calc"></div>

    <div class="chips" id="lg-shoes">${shoes.map(n => `<button type="button" class="chip ${lg.shoe === n ? "on" : ""}" data-shoe="${escapeHtml(n)}">${escapeHtml(n)}</button>`).join("")}<button type="button" class="chip" id="lg-shoe-add">+ shoe</button></div>
    <div id="lg-shoe-new" hidden><div class="fields"><div class="f full text"><div class="l">New shoe</div><input id="lg-shoe-input" placeholder="Name" autocomplete="off"></div></div></div>
    <div class="fields"><div class="f full text"><div class="l">Notes</div><textarea id="lg-notes" placeholder="How it felt, where it hurt, what you ate">${escapeHtml(lg.notes || "")}</textarea></div></div>
    ${lg.status ? `<div style="margin-top:14px"><button type="button" class="link" id="lg-delete">Delete this log</button></div>` : ""}`;
  showSheet(sheetFrame({ title: `Log · ${fmtDay(parseISO(date))}`, sub: escapeHtml(stripTitle(s.title)), body, foot: `<button class="btn" id="lg-skip" type="button">Skipped</button><button class="btn pri" id="lg-save" type="button">Save</button>` }));
  const root = $("#sheet-root");

  function renderImport() {

      extra = FujiStravaSync.stravaActivitiesForPicker(acts).slice(0, 8);

    } catch (err) { flash(err.message || "Strava unavailable"); }
  }
  function apply(a) {
    picked = a;
    const patch = FujiStravaSync.sessionPatchFromStravaActivity(a, s, {});

    g("lg-dist").value = patch.actualDistance || "";
    g("lg-mov").value = patch.actualDuration || "";
    g("lg-el").value = patch.elapsedDuration || "";
    g("lg-hr").value = patch.avgHR || "";
    g("lg-cad").value = patch.cadence ? Math.round(patch.cadence * 2) : "";
    calc(); renderImport();
  }
  function calc() {
    const dist = num(g("lg-dist").value), mov = num(g("lg-mov").value), el = num(g("lg-el").value);
    const parts = [];

    wire(root, "#lg-shoe-add", "click", () => { g("lg-shoe-new").hidden = false; g("lg-shoe-input").focus(); });

/* =========================================================================
   11. PLAN — one week as a timeline, the season one tap away
   ========================================================================= */
function plannedMeta(s, w) {
  if (s.type === "strength_a" || s.type === "strength_b") {
    const sess = FujiStrength.sessionFor(w, s.type === "strength_a" ? "A" : "B");
    return sess ? `${sess.load} · ${sess.exercises.length} exercises${s.distanceKm ? ` · then easy ${s.distanceKm} km` : ""}` : "mobility only";
  }
  if (s.type === "rest") return s.detail.split(" · ")[0].replace(/\.$/, "");
  return [s.distanceKm ? `${s.distanceKm} km` : "", s.duration ? `${s.duration}'` : "", hrCapText(s), s.mpKm ? `last ${s.mpKm} km at ${PACES.goal.target}` : ""].filter(Boolean).join(" · ");
}
function renderPlan() {
  const w = State.week, week = PLAN[w - 1], log = sessionsLog(), today = todayISO(), cur = currentWeekIndex();
  const prog = weekProgress(w);
  const items = week.days.map((s, i) => {
    const l = log[s.date], done = isDone(l), skip = !!l && l.status === "skipped", isToday = s.date === today;

      <button type="button" class="body" data-date="${s.date}"><div class="t">${escapeHtml(stripTitle(s.title))}</div><div class="m ${done ? "log" : ""}">${escapeHtml(done ? logLine(l) : skip ? "skipped" : plannedMeta(s, w))}</div></button>
      <button type="button" class="chk ${done ? "on" : ""}" data-chk="${s.date}" aria-label="${done ? "Undo" : "Mark done"}: ${escapeHtml(stripTitle(s.title))}">${I.check()}</button>
    </div>`;
  }).join("");

  $("#view-plan").innerHTML = `<div class="wrap">
    ${viewHead({ kicker: `Plan · ${ATHLETE.totalWeeks} weeks`, title: `Week ${w}`, sub: `${week.phase.name}${week.isRecovery ? " · down week" : ""}${week.label ? ` · ${escapeHtml(week.label)}` : ""} · ${fmtShort(parseISO(week.startDate))} – ${fmtShort(parseISO(week.endDate))}`,

    <div class="wk" role="tablist" aria-label="Weeks">${PLAN.map(x => `<button type="button" data-w="${x.weekNum}" class="${x.weekNum === w ? "sel" : ""} ${inPlanWindow() && x.weekNum === cur ? "now" : x.weekNum < cur ? "past" : ""} ${x.race ? "race" : ""}" aria-label="Week ${x.weekNum}"></button>`).join("")}</div>
    <div class="note">${week.targetKm} km · ${week.days.filter(d => d.type !== "rest").length} sessions · long run ${week.longRunKm} km${week.bikeMin ? ` · bike ${week.bikeMin}'` : ""}${week.fuel ? ` · ${week.fuel} g/h` : ""}${week.race ? ` · ${raceShort(week.race)}` : ""}</div>
    <div class="tl">${items}</div>

  </div>`;
  const root = $("#view-plan");
  wire(root, "#pl-prev", "click", () => { State.week = Math.max(1, w - 1); renderPlan(); });

  wire(root, ".it .body", "click", b => b.dataset.date > today ? openDetails(b.dataset.date) : openLogSheet(b.dataset.date));
  wire(root, "[data-chk]", "click", b => toggleDone(b.dataset.chk));

function wireSwipe(el, fn) {
  if (el.dataset.swipe) { el.__swipe = fn; return; }
  el.dataset.swipe = "1"; el.__swipe = fn;
  let x0 = 0, y0 = 0, t0 = 0;
  el.addEventListener("touchstart", e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; t0 = Date.now(); }, { passive: true });
  el.addEventListener("touchend", e => { const t = e.changedTouches[0]; const dx = t.clientX - x0, dy = t.clientY - y0; if (Date.now() - t0 > 600 || Math.abs(dx) < 70 || Math.abs(dy) > 45) return; el.__swipe(dx < 0 ? -1 : 1); }, { passive: true });
}
function openSeason() {
  const cur = currentWeekIndex();
  const maxKm = Math.max(...PLAN.map(w => w.targetKm));
  const shape = `<div class="bars season">${PLAN.map(w => `<div class="b"><i class="${inPlanWindow() && w.weekNum === cur ? "now" : w.race ? "race" : w.isRecovery ? "down" : ""}" style="height:${(w.targetKm / maxKm * 100).toFixed(1)}%"></i><span class="cap ${inPlanWindow() && w.weekNum === cur ? "now" : ""}">${w.weekNum}</span></div>`).join("")}</div>
    <div class="legend">${PHASES.map(p => `<span>${p.name} W${p.weeks[0]}–${p.weeks[1]}</span>`).join("")}</div>`;
  showSheet(sheetFrame({ title: "Season", sub: `${fmtShort(parseISO(ATHLETE.planStart))} → 13 Dec`, body: shape + `<div class="tbl">${PLAN.map(w => `<button type="button" class="tr ${w.weekNum < cur ? "dim" : ""}" data-w="${w.weekNum}" style="grid-template-columns:44px 1fr auto"><b class="${inPlanWindow() && w.weekNum === cur ? "now" : ""}">W${w.weekNum}</b><span>${fmtShort(parseISO(w.startDate))} · ${w.phase.name}${w.isRecovery ? " · down" : ""}${w.race ? ` · ${raceShort(w.race)}` : w.label ? ` · ${escapeHtml(w.label)}` : ""}</span><span class="right"><b>${w.targetKm} km</b><small>long ${w.longRunKm} km</small></span></button>`).join("")}</div>
    <div class="note">${PLAN_OBJ.slip ? `Gate slipped ${PLAN_OBJ.slip} week${PLAN_OBJ.slip > 1 ? "s" : ""} · ` : ""}${PHASES.map(p => `${p.name} W${p.weeks[0]}–${p.weeks[1]}`).join(" · ")}</div>` }));

/* =========================================================================
   12. DATA — what actually happened, next to the plan
   ========================================================================= */
function latestAnalyzedLongRun() {
  const withIntel = stravaActs().filter(a => a.intel && a.distanceKm >= 15).sort((a, b) => String(b.localDate).localeCompare(String(a.localDate)));
  if (withIntel.length) return withIntel[0];
  const fromLog = Object.entries(sessionsLog()).filter(([d, lg]) => lg && lg.intel).sort((a, b) => b[0].localeCompare(a[0]));
  return fromLog.length ? { localDate: fromLog[0][0], name: fromLog[0][1].title, distanceKm: parseFloat(fromLog[0][1].actualDistance) || 0, intel: fromLog[0][1].intel } : null;
}
function computeGuard(wIdx) {
  const week = PLAN[wIdx - 1];
  const byDate = FujiRecords.runsByDate(stravaActs(), sessionsLog());
  const rows = FujiRecords.weeklyKm(byDate, PLAN_OBJ, { today: week.startDate, back: 8, ahead: 0 });
  const kms = rows.map(r => r.km), idx = rows.length - 1;
  const trailing = kms.slice(Math.max(0, idx - 4), idx);
  const acwr = FujiIntel.acwrKm(kms, idx);
  const guard = FujiIntel.weeklyGuard(week.targetKm, trailing);
  const jump = FujiIntel.longRunJump(week.longRunKm, rows.slice(Math.max(0, idx - 2), idx).map(r => r.longest));
  const lr = latestAnalyzedLongRun();
  const flags = [];
  (PLAN_OBJ.warnings || []).forEach(t => flags.push({ cls: "warn", text: t }));
  FujiPlanEngine.checkProgression(PLAN_OBJ, GUARDS).forEach(v => flags.push({ cls: "bad", text: `Plan guard ${v.rule} in W${v.week}: ${v.ratio}× (limit ${v.limit}).` }));
  if (guard.capped) flags.push({ cls: "bad", text: `${week.targetKm} km planned is above 1.5× the trailing average (${guard.avg} km). Cap this week at ${guard.capKm} km.` });
  else if (guard.caution) flags.push({ cls: "warn", text: `${guard.ratio}× the trailing 4-week average (${guard.avg} km). Above 1.3× — keep every easy run easy.` });
  if (jump.flag) flags.push({ cls: "bad", text: `Long run ${week.longRunKm} km is ${jump.ratio}× the longest of the last two weeks (${jump.max} km). Run ${Math.round(jump.max * 1.2)} km instead.` });
  if (lr && lr.intel) {

    ${sec("Weeks", "target · long run · quality", `<div class="scroll"><table class="table"><thead><tr><th>Wk</th><th>Dates</th><th>Phase</th><th>km</th><th>TID</th><th>Quality</th><th>Long run</th><th>Race</th></tr></thead><tbody>${FujiStore.ARCHIVE_32_WEEKS.map(w => `<tr><td><b>W${w.week}</b>${w.isRecovery ? " ·rec" : ""}</td><td>${fmtShort(parseISO(w.startDate))} – ${fmtShort(parseISO(w.endDate))}</td><td>${w.phaseShort}</td><td>${w.targetKm}</td><td>${w.tid}</td><td>${escapeHtml(w.quality)}</td><td>${w.isHill ? "hill week" : w.longRunMin + " min"}</td><td>${w.race ? `<b>${escapeHtml(w.race)}</b>` : ""}</td></tr>`).join("")}</tbody></table></div>`)}
    ${sec("Long runs", "planned · actual", `<div class="scroll"><table class="table"><thead><tr><th>Wk</th><th>Date</th><th>Planned</th><th>Actual</th><th>km</th><th>Pace</th><th>HR</th><th>Source</th></tr></thead><tbody>${longRuns.map(r => `<tr class="${r.done ? "hl" : ""}"><td><b>W${r.week}</b></td><td>${fmtShort(parseISO(r.date))}</td><td>${r.plannedDuration} min</td><td>${r.actualDuration ? r.actualDuration + " min" : "—"}</td><td>${r.actualDistance || "—"}</td><td>${r.pace ? escapeHtml(r.pace) : "—"}</td><td>${r.avgHR || "—"}</td><td>${r.done ? (r.source === "strava" ? "Strava" : "manual") : "—"}</td></tr>`).join("")}</tbody></table></div>`)}
    ${sec("Activities", `${rows.length}`, rows.length ? `<div class="scroll"><table class="table"><thead><tr><th>Date</th><th>Activity</th><th>Type</th><th>Time</th><th>km</th><th>Pace</th><th>HR</th></tr></thead><tbody>${rows.map(r => `<tr><td>${fmtShort(parseISO(r.date))}</td><td><b>${escapeHtml(r.stravaName || r.title || "Activity")}</b></td><td>${escapeHtml(r.stravaSport || r.type || "")}</td><td>${r.actualDuration ? r.actualDuration + " min" : "—"}</td><td>${r.actualDistance || "—"}</td><td>${r.pace ? escapeHtml(r.pace) : "—"}</td><td>${r.avgHR || "—"}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">No archive activities. Import Strava to fill May – August.</div>`)}
  </div>`;
  const root = $("#view-archive");
  wire(root, "#ar-repair", "click", () => { const r = Store.repair(); flash(`Moved ${r.fixedCount}`); renderArchive(); });

    b.disabled = true; b.textContent = "Importing";
    try {
      const data = await stravaFetch("/api/strava/activities?days=365");
      const acts = data.activities || [];
      mergeStravaActivities(acts);
      const summary = applyStravaActivitiesToArchive(acts);
      flash(`${summary.imported} new · ${summary.updated} updated`);
      renderArchive();
    } catch (err) { flash(err.message || "Strava unavailable"); b.disabled = false; b.textContent = "Import Strava"; }
  });
}
function applyStravaActivitiesToArchive(activities) {
  const archive = Store.get(STORAGE.archiveSessions, {});
  const log = FujiStore.isPlainRecord(archive) ? archive : {};
  const summary = { imported: 0, updated: 0, skipped: 0 };
  const dates = [...new Set(activities.filter(FujiStravaSync.isStravaTrainingActivity).map(a => a.localDate).filter(FujiStore.isLegacyArchiveDateKey))].sort();
  const lrs = FujiStore.archive32LongRuns({});
  dates.forEach(date => {
    const lr = lrs.find(r => r.date === date);
    const planned = { title: lr ? lr.title : "", duration: lr ? lr.plannedDuration : "", type: lr ? lr.type : "easy_z1", hrTarget: lr && lr.type === "tune_race" ? "race effort" : "" };
    const a = FujiStravaSync.activitiesForDay(activities, date, planned)[0];
    if (!a) { summary.skipped++; return; }
    const existing = log[date] || {};
    if (String(existing.stravaId || "") === String(a.id) || (existing.status && existing.source !== "strava")) { summary.skipped++; return; }
    const isUpdate = existing.source === "strava";
    log[date] = { ...FujiStravaSync.sessionPatchFromStravaActivity(a, { ...planned, title: planned.title || a.name }, { ...existing, status: "done" }), archivePlan: "legacy-32-week", archiveWeek: lr ? lr.week : "" };
    if (isUpdate) summary.updated++; else summary.imported++;
  });
  Store.set(STORAGE.archiveSessions, log);
  Store.set(STORAGE.strava, { ...stravaState(), lastArchiveSync: new Date().toISOString(), lastArchiveSummary: summary });
  return summary;
}

  ["Fuel", "60 – 90 g carbohydrate an hour with glucose + fructose; carb load 10 g/kg for three days.", "Jeukendrup 2014 · Burke 2017"],
  ["Zones", "Formula heart-rate zones are far less accurate than ventilatory-threshold zones from a lab test.", "Jamnick 2020, Sports Med"],
  ["Drift", "Heart-rate drift at constant pace comes from plasma-volume loss, heat and glycogen; under 5 % is durable.", "Coyle 2005 · Friel"],
  ["Warm-up", "A short dynamic warm-up improves performance and may reduce injury versus static stretching.", "McGowan 2015 · Behm 2011"]
];
const WARMUP = [["Easy jog", "3 – 5 min"], ["Leg swings · front and side", "10 each leg"], ["Walking lunges with rotation", "10 each leg"], ["A-skips", "2 × 20 m"], ["High knees · butt kicks", "2 × 20 m each"], ["Strides", "4 × 80 – 100 m · 70 → 95 % · 90 s walk"]];
function renderEvidence() {
  $("#view-evidence").innerHTML = `<div class="wrap wide">
    ${viewHead({ kicker: "Evidence", title: "Evidence", sub: "The rules this plan runs on, one line each" })}
    <div class="two"><div>
    ${sec("Rules", "source", `<div class="rows">${EVIDENCE.map(e => `<div class="r"><div class="body"><div class="t">${escapeHtml(e[0])}</div><div class="m" style="color:var(--ink-2)">${escapeHtml(e[1])}</div><div class="m">${escapeHtml(e[2])}</div></div></div>`).join("")}</div>`)}

    ${sec("Warm-up", "before quality and long runs", `<div class="tbl">${WARMUP.map(w => `<div class="tr" style="grid-template-columns:1fr auto"><span style="color:var(--ink)">${escapeHtml(w[0])}</span><span class="right">${escapeHtml(w[1])}</span></div>`).join("")}</div>`)}
    ${sec("Guards", "checked every week", `<div class="tbl">${[["Weekly ramp", `≤ ${Math.round(GUARDS.weeklyRampMax * 100)} %`], ["Long-run jump", `≤ ${GUARDS.longRunJumpMax}×`], ["Long-run share", `≤ ${Math.round(GUARDS.longRunShareMax * 100)} % of the week`], ["ACWR", `watch ${GUARDS.acwrCaution} · cap ${GUARDS.acwrDanger}`], ["Stopped time", `< ${GUARDS.stopPctMax} %`], ["Cadence decay", `< ${GUARDS.cadenceDecayMax} %`], ["HR drift", `< ${GUARDS.hrDriftMax} %`]].map(g => `<div class="tr" style="grid-template-columns:1fr auto"><span style="color:var(--ink)">${g[0]}</span><span class="right">${g[1]}</span></div>`).join("")}</div>`)}

/* =========================================================================
   18. STRAVA — sync through the Vercel functions (the secret never reaches the browser)
   ========================================================================= */
async function stravaFetch(path, options = {}) {
  if (location.protocol === "file:") throw new Error("Open the deployed app to use Strava");
  const res = await fetch(path, { credentials: "include", ...options });
  const data = await res.json().catch(() => ({ ok: false, error: "Strava returned an invalid response" }));
  if (!res.ok || data.ok === false) throw new Error(data.error || "Strava request failed");
  return data;
}
function mergeStravaActivities(acts) {
  const st = stravaState();
  Store.set(STORAGE.strava, { ...st, activities: FujiStravaSync.compactStravaActivities(acts, st.activities || []) });
}
async function syncStrava(btn) {
  const label = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "Syncing"; }
  try {
    const data = await stravaFetch("/api/strava/activities?days=90");
    const acts = data.activities || [];
    const { log, summary } = FujiStravaSync.applyStravaActivitiesToSessions(acts, sessionsLog(), PLAN_OBJ);
    Store.set(STORAGE.sessions, log);
    mergeStravaActivities(acts);
    Store.set(STORAGE.strava, { ...stravaState(), lastSync: new Date().toISOString(), lastSummary: summary });
    let analyzed = 0;
    try { analyzed = await enrichLongRunIntel(4); } catch (_) { /* streams are optional */ }
    flash(`${summary.imported} imported · ${summary.updated} updated${analyzed ? ` · ${analyzed} long run${analyzed === 1 ? "" : "s"} analyzed` : ""}`);
    rerender();
  } catch (err) {
    flash(err.message || "Strava sync failed");
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
}
async function enrichLongRunIntel(limit = 6) {
  const st = stravaState();
  const acts = Array.isArray(st.activities) ? st.activities : [];
  const todo = acts.filter(a => FujiStravaSync.isRun(a) && a.distanceKm >= 15 && !a.intel).slice(-limit);
  let done = 0;
  for (const a of todo) {
    try {
      const data = await stravaFetch(`/api/strava/streams?id=${encodeURIComponent(a.id)}&points=400`);
      const intel = FujiIntel.analyzeStreams(data.streams || {});
      if (!intel) continue;
      a.intel = intel; done++;
      const log = sessionsLog();
      const hit = Object.entries(log).find(([d, lg]) => lg && String(lg.stravaId) === String(a.id));
      if (hit) { log[hit[0]] = { ...hit[1], intel, elapsedDuration: hit[1].elapsedDuration || Math.round(intel.elapsedSec / 60) }; Store.set(STORAGE.sessions, log); }
    } catch (err) { console.warn("[intel]", a.id, err.message); }
  }
  Store.set(STORAGE.strava, { ...stravaState(), activities: acts, lastIntel: new Date().toISOString() });
  return done;
}
async function disconnectStrava() {
  if (!await confirmSheet("Disconnect Strava from this browser. Synced data stays.", "Disconnect")) return;
  try {
    await stravaFetch("/api/strava/disconnect", { method: "POST" });
    Store.set(STORAGE.strava, { ...stravaState(), disconnectedAt: new Date().toISOString() });
    flash("Strava disconnected"); renderSettings();
  } catch (err) { flash(err.message || "Could not disconnect"); }
}
async function renderStravaBlock() {
  const el = $("#strava-block"); if (!el) return;
  const st = stravaState();
  const last = st.lastSync ? `last sync ${new Date(st.lastSync).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}` : "never synced";
  const summary = st.lastSummary ? `${st.lastSummary.imported} imported · ${st.lastSummary.updated} updated · ${st.lastSummary.manualSkipped} manual kept · ${st.lastSummary.outsidePlan} outside the plan` : "";
  const row = (t, m, v) => `<div class="r"><div class="ic">${I.trend()}</div><div class="body"><div class="t">${t}</div><div class="m">${m}</div></div>${v ? `<span class="v">${v}</span>` : ""}</div>`;
  let status;
  try { status = await stravaFetch("/api/strava/status"); }
  catch (err) { el.innerHTML = row("Strava", `${escapeHtml(err.message)} · ${last}`, "offline"); return; }
  if (status.setupRequired) { el.innerHTML = row("Strava", `Vercel is missing ${escapeHtml((status.missingEnv || []).join(", "))}`, "setup"); return; }
  if (!status.connected) {
    el.innerHTML = row("Strava", `Not connected · ${last}`) + `<div class="btnrow"><button class="btn pri" id="sv-connect" type="button">Connect Strava</button></div>`;
    wire(el, "#sv-connect", "click", () => { window.location.href = "/api/strava/auth"; });
    return;
  }
  const who = status.meta && status.meta.athlete ? [status.meta.athlete.firstname, status.meta.athlete.lastname].filter(Boolean).join(" ") || status.meta.athlete.username : "";
  el.innerHTML = row("Strava connected", `${escapeHtml(who)} · ${last}${summary ? `<br>${summary}` : ""}`) + `<div class="btnrow"><button class="btn pri" id="sv-sync" type="button">Sync 90 days</button><button class="btn" id="sv-intel" type="button">Analyze long runs</button></div><div style="margin-top:12px"><button type="button" class="link" id="sv-off">Disconnect</button></div>`;
  wire(el, "#sv-sync", "click", b => syncStrava(b).then(renderStravaBlock));
  wire(el, "#sv-intel", "click", async b => { b.disabled = true; b.textContent = "Analyzing"; try { const n = await enrichLongRunIntel(8); flash(`${n} long run${n === 1 ? "" : "s"} analyzed`); } catch (err) { flash(err.message || "Could not analyze"); } renderStravaBlock(); });
  wire(el, "#sv-off", "click", disconnectStrava);
}

/* =========================================================================
   19. SETTINGS
   ========================================================================= */
const APP_VERSION = "v11 · 2026-09";
function renderSettings() {
  const audit = Store.audit();
  const shoes = Array.isArray(getSettings().shoes) ? getSettings().shoes : [];
  const counts = [["Sessions", Object.keys(sessionsLog()).length], ["Strength", strengthLog().length], ["Mornings", Object.keys(readinessLog()).length], ["Archive", Object.keys(Store.get(STORAGE.archiveSessions, {}) || {}).length], ["Strava", stravaActs().length]];
  $("#view-settings").innerHTML = `<div class="wrap">
    ${viewHead({ kicker: "Settings", title: "Settings", sub: `Endurance 2026 · ${APP_VERSION}` })}
    ${sec("Strava", "", `<div class="rows" id="strava-block"><div class="r"><div class="ic">${I.trend()}</div><div class="body"><div class="t">Strava</div><div class="m">Checking</div></div></div></div>`)}
    ${sec("Plan", `${PLAN_OBJ.slip ? `gate slipped ${PLAN_OBJ.slip} wk` : "gate at W1"}`, `<div class="fields"><div class="f text"><div class="l">Gate · first run after the injury</div><input type="date" id="cfg-gate" value="${planGateDate()}" min="${PLAN_SPEC.startDate}" max="${FujiPlanEngine.addDays(PLAN_SPEC.startDate, 27)}"></div><div class="f text" style="border:none;display:flex;align-items:flex-end"><button class="btn sm" id="cfg-apply" type="button">Rebuild plan</button></div></div>
      <div class="note">Slipping the gate a week pushes the return block right and drops a week from the middle, so race day, the 30 km run and the half test stay put. Three weeks is the compressed plan.</div>`)}
    ${sec("Shoes", `${shoes.length}`, shoes.length ? `<div class="chips">${shoes.map(s => `<button type="button" class="chip" data-shoe-rm="${escapeHtml(s)}">${escapeHtml(s)} <span class="dim">×</span></button>`).join("")}</div>` : `<div class="empty">Add shoes from the log sheet.</div>`)}
    ${sec("Backup", "", `<div class="btnrow" style="margin-top:12px"><button class="btn" id="bk-export" type="button">Export JSON</button><button class="btn" id="bk-import" type="button">Import JSON</button></div><div class="note">Everything lives in this browser. Export before changing phones.</div>`)}
    ${sec("Data health", audit.summary.issueCount ? `${audit.summary.issueCount} issue${audit.summary.issueCount === 1 ? "" : "s"}` : "clean", audit.summary.issueCount ? `<div class="rows">${audit.issues.slice(0, 8).map(i => `<div class="r"><div class="body"><div class="t">${escapeHtml(i.code)}${i.date ? ` · ${i.date}` : ""}</div><div class="m">${escapeHtml(i.message)}</div></div>${i.safeFix ? '<span class="v">fixable</span>' : ""}</div>`).join("")}</div>${audit.summary.safeFixableCount ? `<div class="btnrow"><button class="btn sm" id="dh-repair" type="button">Repair ${audit.summary.safeFixableCount}</button></div>` : ""}` : `<div class="stats" style="grid-template-columns:repeat(3,1fr)">${counts.map(c => `<div class="stat"><div class="n">${c[1]}</div><div class="l">${c[0]}</div></div>`).join("")}</div>`)}
    ${sec("Reset", "", `<div class="rows">${[["rs-sess", "Clear session log"], ["rs-body", "Clear morning numbers"], ["rs-strength", "Clear strength log"], ["rs-archive", "Clear archive"], ["rs-all", "Erase everything"]].map(r => `<button type="button" class="r act" id="${r[0]}"><div class="body"><div class="t">${r[1]}</div></div><span class="chev">${I.right()}</span></button>`).join("")}</div>`)}
  </div>`;
  const root = $("#view-settings");
  wire(root, "#cfg-apply", "click", () => { patchSettings({ gateDate: $("#cfg-gate", root).value }); rebuildPlan(); State.init(); flash(PLAN_OBJ.slip ? `Rebuilt · gate slipped ${PLAN_OBJ.slip} wk` : "Rebuilt · gate at W1"); renderSettings(); renderCountdown(); });
  wire(root, "[data-shoe-rm]", "click", b => { patchSettings({ shoes: shoes.filter(s => s !== b.dataset.shoeRm) }); renderSettings(); });
  wire(root, "#bk-export", "click", () => {
    const blob = new Blob([JSON.stringify(Store.exportAll(), null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob); const a = document.createElement("a");
    a.href = url; a.download = `endurance-backup-${todayISO()}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
  wire(root, "#bk-import", "click", () => {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = ev => { try { Store.importAll(JSON.parse(ev.target.result)); rebuildPlan(); State.init(); flash("Imported"); renderSettings(); } catch (_) { flash("Not a valid backup"); } }; r.readAsText(f); };
    inp.click();
  });
  wire(root, "#dh-repair", "click", () => { const r = Store.repair(); flash(`Repaired ${r.fixedCount}`); renderSettings(); });
  const clear = async (id, text, fn) => wire(root, "#" + id, "click", async () => { if (await confirmSheet(text, "Clear")) { fn(); renderSettings(); flash("Cleared"); } });
  clear("rs-sess", "Delete every logged session in the current plan.", () => Store.clear(STORAGE.sessions));
  clear("rs-body", "Delete every morning weight, resting heart rate, HRV and sleep entry.", () => Store.clear(STORAGE.readiness));
  clear("rs-strength", "Delete every strength log.", () => Store.clear(STORAGE.strength));
  clear("rs-archive", "Delete the archive logs.", () => Store.clear(STORAGE.archiveSessions));
  clear("rs-all", "Delete everything stored in this browser: logs, settings, Strava data.", () => { Object.values(STORAGE).concat(["fuji_foot"]).forEach(k => Store.clear(k)); rebuildPlan(); State.init(); });
  renderStravaBlock();
}

/* =========================================================================
   20. INIT
   ========================================================================= */
Object.assign(VIEWS, { today: renderToday, plan: renderPlan, data: renderData, race: renderRace, strength: renderStrength, athlete: renderAthlete, archive: renderArchive, evidence: renderEvidence, settings: renderSettings });
function showStorageWarning() {
  const b = document.createElement("div");
  b.className = "banner"; b.setAttribute("role", "alert");
  b.innerHTML = '<span style="flex:1">Storage is unavailable, so nothing will be saved. Leave private browsing or export after each session.</span><button type="button" aria-label="Dismiss">×</button>';
  b.querySelector("button").addEventListener("click", () => b.remove());
  document.body.appendChild(b);
}
function showUpdateBanner() {
  if ($(".banner.update")) return;
  const b = document.createElement("div");
  b.className = "banner update"; b.setAttribute("role", "status");
  b.innerHTML = '<span style="flex:1">A new version is ready.</span><button class="link" type="button" style="color:var(--ink);font-weight:600">Reload</button>';
  b.querySelector("button").addEventListener("click", () => location.reload());
  document.body.appendChild(b);
}
function init() {
  State.init();
  renderNav(); renderCountdown(); setupTopbar();
  if (!Store.ok) showStorageWarning();
  const p = new URLSearchParams(location.search);
  const sr = p.get("strava");
  if (sr) {
    switchView("settings");
    flash(sr === "connected" ? "Strava connected" : sr === "denied" ? "Strava connection cancelled" : "Add the Strava keys in Vercel first");
    history.replaceState({}, document.title, location.pathname);
  } else {
    switchView(VIEWS[p.get("view")] ? p.get("view") : "today");
  }
  setInterval(renderCountdown, 3600e3);
  let lastDay = todayISO(), phone = isPhone();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && todayISO() !== lastDay) { lastDay = todayISO(); State.init(); rerender(); } });
  window.addEventListener("resize", () => { if (isPhone() !== phone) { phone = isPhone(); rerender(); } });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init, { once: true }); else init();

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").then(reg => {
      reg.addEventListener("updatefound", () => {
        const sw = reg.installing;
        if (!sw || !navigator.serviceWorker.controller) return;   // first install, nothing to announce
        sw.addEventListener("statechange", () => { if (sw.state === "installed") showUpdateBanner(); });
      });
    }).catch(() => { /* offline support is optional */ });
  });
}
